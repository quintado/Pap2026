<!DOCTYPE html>
<html lang="pt-PT">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CamiGest - Calendário</title>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Outfit:wght@600;700;800&display=swap"
    rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="stylesheet" href="css/modern-design.css">
  <link rel="stylesheet" href="css/responsive.css">
  <style>
    * { box-sizing: border-box; }

    body {
      display: flex;
      min-height: 100vh;
      margin: 0;
      font-family: 'Inter', sans-serif;
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
      overflow-x: hidden;
    }

    /* ── Sidebar ── */
    .sidebar {
      width: 260px;
      background: rgba(255,255,255,0.05);
      backdrop-filter: blur(20px);
      border-right: 1px solid rgba(255,255,255,0.1);
      display: flex;
      flex-direction: column;
      padding: 24px 16px;
      position: fixed;
      height: 100vh;
      z-index: 100;
    }
    .sidebar-logo {
      text-align: center;
      margin-bottom: 40px;
      padding-bottom: 24px;
      border-bottom: 1px solid rgba(255,255,255,0.1);
    }
    .sidebar-logo h2 {
      font-family: 'Outfit', sans-serif;
      font-size: 28px;
      font-weight: 800;
      background: linear-gradient(135deg, #3b82f6, #0ea5e9);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      margin: 0;
    }
    .sidebar ul { list-style: none; padding: 0; margin: 0; flex: 1; }
    .sidebar ul li { margin-bottom: 8px; }
    .sidebar ul li a {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px 16px;
      color: var(--text-secondary);
      text-decoration: none;
      border-radius: 12px;
      transition: all 0.3s cubic-bezier(0.4,0,0.2,1);
      font-weight: 500;
      font-size: 15px;
      position: relative;
      overflow: hidden;
    }
    .sidebar ul li a::before {
      content: '';
      position: absolute;
      left: 0; top: 0;
      height: 100%; width: 3px;
      background: #2563eb;
      transform: scaleY(0);
      transition: transform 0.3s;
    }
    .sidebar ul li a:hover,
    .sidebar ul li a.active {
      background: rgba(37,99,235,0.1);
      color: var(--text-primary);
      transform: translateX(4px);
    }
    .sidebar ul li a.active::before { transform: scaleY(1); }
    .sidebar-footer {
      padding-top: 24px;
      border-top: 1px solid rgba(255,255,255,0.1);
    }
    #logout {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, #ef4444, #dc2626);
      border: none;
      border-radius: 12px;
      color: white;
      font-weight: 600;
      font-size: 15px;
      cursor: pointer;
      transition: all 0.3s;
      box-shadow: 0 4px 12px rgba(239,68,68,0.3);
    }
    #logout:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(239,68,68,0.5); }

    /* ── Main ── */
    .main {
      flex: 1;
      margin-left: 260px;
      padding: 32px;
      animation: fadeInUp 0.6s ease-out;
    }

    .page-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 28px;
    }
    .page-header h1 {
      font-size: 28px;
      font-weight: 700;
      color: var(--text-primary);
      font-family: 'Outfit', sans-serif;
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 0;
    }

    /* ── Legend ── */
    .legend {
      display: flex;
      gap: 20px;
      flex-wrap: wrap;
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 12px;
      padding: 14px 20px;
      margin-bottom: 24px;
    }
    .legend-item {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      color: var(--text-secondary);
    }
    .legend-dot {
      width: 12px; height: 12px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    /* ── Calendar navigation ── */
    .cal-nav {
      display: flex;
      align-items: center;
      gap: 16px;
    }
    .nav-btn {
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.1);
      color: var(--text-primary);
      width: 40px; height: 40px;
      border-radius: 10px;
      cursor: pointer;
      font-size: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
    }
    .nav-btn:hover {
      background: rgba(37,99,235,0.2);
      border-color: rgba(37,99,235,0.4);
      transform: scale(1.05);
    }
    .cal-month-label {
      font-family: 'Outfit', sans-serif;
      font-size: 22px;
      font-weight: 700;
      color: var(--text-primary);
      min-width: 220px;
      text-align: center;
    }

    /* ── Calendar grid ── */
    .calendar-wrapper {
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 20px;
      overflow: hidden;
    }
    .cal-weekdays {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      background: rgba(37,99,235,0.15);
      border-bottom: 1px solid rgba(255,255,255,0.08);
    }
    .cal-weekday {
      text-align: center;
      padding: 14px 4px;
      font-size: 12px;
      font-weight: 700;
      color: #60a5fa;
      text-transform: uppercase;
      letter-spacing: 0.8px;
    }
    .cal-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
    }
    .cal-day {
      min-height: 120px;
      border-right: 1px solid rgba(255,255,255,0.05);
      border-bottom: 1px solid rgba(255,255,255,0.05);
      padding: 8px;
      position: relative;
      transition: background 0.2s;
    }
    .cal-day:nth-child(7n) { border-right: none; }
    .cal-day.other-month { opacity: 0.3; }
    .cal-day.today { background: rgba(37,99,235,0.08); }
    .cal-day:hover { background: rgba(255,255,255,0.04); }
    .day-number {
      font-size: 13px;
      font-weight: 600;
      color: var(--text-secondary);
      width: 28px; height: 28px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      margin-bottom: 4px;
    }
    .cal-day.today .day-number {
      background: #2563eb;
      color: white;
    }

    /* ── Events ── */
    .cal-event {
      font-size: 11px;
      font-weight: 600;
      padding: 3px 7px;
      border-radius: 6px;
      margin-bottom: 3px;
      line-height: 1.3;
      cursor: default;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      transition: transform 0.15s;
    }
    .cal-event:hover {
      transform: scale(1.03);
      z-index: 10;
      position: relative;
      white-space: normal;
      overflow: visible;
    }
    .event-saida {
      background: rgba(34,197,94,0.2);
      color: #4ade80;
      border-left: 3px solid #22c55e;
    }
    .event-prevista {
      background: rgba(168,85,247,0.2);
      color: #c084fc;
      border-left: 3px solid #a855f7;
    }
    .event-transit {
      background: rgba(245,158,11,0.12);
      color: #fbbf24;
      border-left: 3px solid #f59e0b;
    }

    /* ── Tooltip ── */
    .cal-event[title]:hover::after {
      content: attr(title);
      position: absolute;
      bottom: calc(100% + 4px);
      left: 0;
      background: rgba(15,23,42,0.98);
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 8px;
      padding: 8px 12px;
      font-size: 12px;
      color: #f8fafc;
      white-space: nowrap;
      z-index: 1000;
      pointer-events: none;
    }

    /* ── Loading state ── */
    .cal-loading {
      text-align: center;
      padding: 60px 0;
      color: var(--text-secondary);
      font-size: 15px;
    }

    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(30px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    @media (max-width: 1024px) {
      .sidebar { width: 220px; }
      .main { margin-left: 220px; }
    }
    @media (max-width: 768px) {
      .cal-day { min-height: 80px; font-size: 11px; }
      .cal-month-label { font-size: 16px; min-width: 140px; }
      .page-header { flex-direction: column; align-items: flex-start; gap: 12px; }
    }
    @media (max-width: 480px) {
      .cal-day { min-height: 60px; padding: 4px; }
      .cal-weekday { font-size: 10px; padding: 8px 2px; }
    }
  </style>
</head>

<body>
  <!-- Hamburger button -->
  <button class="hamburger-btn" id="hamburgerBtn" aria-label="Abrir menu">
    <i data-lucide="menu" style="width:22px;height:22px;"></i>
  </button>
  <!-- Sidebar overlay -->
  <div class="sidebar-overlay" id="sidebarOverlay"></div>
  <nav class="sidebar">
    <div class="sidebar-logo">
      <h2><i data-lucide="truck"
          style="display:inline-block;width:26px;height:26px;vertical-align:middle;margin-right:6px;"></i>CamiGest
      </h2>
    </div>
    <ul>
      <li><a href="dashboard.html"><i data-lucide="layout-dashboard" style="width:18px;height:18px;"></i> Dashboard</a></li>
      <li><a href="entregas.html"><i data-lucide="package" style="width:18px;height:18px;"></i> Entregas</a></li>
      <li><a href="camioes.html"><i data-lucide="truck" style="width:18px;height:18px;"></i> Camiões</a></li>
      <li><a class="active" href="calendario.html"><i data-lucide="calendar" style="width:18px;height:18px;"></i> Calendário</a></li>
      <li><a href="config.html"><i data-lucide="settings" style="width:18px;height:18px;"></i> Configurações</a></li>
    </ul>
    <div class="sidebar-footer">
      <button id="logout"><i data-lucide="log-out" style="width:18px;height:18px;margin-right:8px;"></i>Terminar Sessão</button>
    </div>
  </nav>

  <div class="main">
    <div class="page-header">
      <h1><i data-lucide="calendar" style="width:26px;height:26px;"></i> Calendário de Entregas</h1>
      <div class="cal-nav">
        <button class="nav-btn" id="prevBtn"><i data-lucide="chevron-left" style="width:18px;height:18px;"></i></button>
        <span class="cal-month-label" id="monthLabel">—</span>
        <button class="nav-btn" id="nextBtn"><i data-lucide="chevron-right" style="width:18px;height:18px;"></i></button>
      </div>
    </div>

    <div class="legend">
      <div class="legend-item">
        <div class="legend-dot" style="background:#22c55e;"></div>
        <i data-lucide="arrow-up-right" style="width:14px;height:14px;color:#22c55e;"></i>
        <span>Data de Saída</span>
      </div>
      <div class="legend-item">
        <div class="legend-dot" style="background:#a855f7;"></div>
        <i data-lucide="flag" style="width:14px;height:14px;color:#a855f7;"></i>
        <span>Data Prevista de Entrega</span>
      </div>
      <div class="legend-item">
        <div class="legend-dot" style="background:#f59e0b;"></div>
        <i data-lucide="truck" style="width:14px;height:14px;color:#f59e0b;"></i>
        <span>Em Trânsito</span>
      </div>
    </div>

    <div class="calendar-wrapper">
      <div class="cal-weekdays">
        <div class="cal-weekday">Dom</div>
        <div class="cal-weekday">Seg</div>
        <div class="cal-weekday">Ter</div>
        <div class="cal-weekday">Qua</div>
        <div class="cal-weekday">Qui</div>
        <div class="cal-weekday">Sex</div>
        <div class="cal-weekday">Sáb</div>
      </div>
      <div class="cal-grid" id="calGrid">
        <div class="cal-loading" style="grid-column:1/-1;">A carregar entregas...</div>
      </div>
    </div>
  </div>

  <!-- Bottom Navigation (mobile) -->
  <nav class="bottom-nav">
    <a href="dashboard.html">
      <i data-lucide="layout-dashboard"></i>
      <span>Dashboard</span>
    </a>
    <a href="entregas.html">
      <i data-lucide="package"></i>
      <span>Entregas</span>
    </a>
    <a href="camioes.html">
      <i data-lucide="truck"></i>
      <span>Camiões</span>
    </a>
    <a href="calendario.html" class="active">
      <i data-lucide="calendar"></i>
      <span>Calendário</span>
    </a>
    <a href="config.html">
      <i data-lucide="settings"></i>
      <span>Config</span>
    </a>
  </nav>

  <script>
    const user = JSON.parse(localStorage.getItem('user'));
    if (!user) window.location.href = 'index.html';

    const isManager = user.role === 'CEO' || user.role === 'supervisor';

    let currentYear = new Date().getFullYear();
    let currentMonth = new Date().getMonth(); // 0-indexed
    let allDeliveries = [];

    const monthNames = [
      'Janeiro', 'Fevereiro', 'Março', 'Abril', 'Maio', 'Junho',
      'Julho', 'Agosto', 'Setembro', 'Outubro', 'Novembro', 'Dezembro'
    ];

    document.getElementById('prevBtn').onclick = () => {
      currentMonth--;
      if (currentMonth < 0) { currentMonth = 11; currentYear--; }
      renderCalendar();
    };
    document.getElementById('nextBtn').onclick = () => {
      currentMonth++;
      if (currentMonth > 11) { currentMonth = 0; currentYear++; }
      renderCalendar();
    };

    async function loadDeliveries() {
      try {
        const company = encodeURIComponent((user.company || '').trim());
        const res = await fetch(`${window.location.origin}/deliveries?company=${company}`);
        const data = await res.json();
        if (!res.ok || !Array.isArray(data)) { allDeliveries = []; }
        else {
          // Filtrar por camionista se não for gestor
          allDeliveries = isManager
            ? data
            : data.filter(d => d.assigned_to === user.id);
        }
        renderCalendar();
      } catch (err) {
        allDeliveries = [];
        renderCalendar();
      }
    }

    // Build a map: dateStr => [{type, label, delivery}]
    function buildEventMap() {
      const map = {};

      function addEvent(dateStr, ev) {
        if (!dateStr) return;
        if (!map[dateStr]) map[dateStr] = [];
        map[dateStr].push(ev);
      }

      // Excluir entregas concluídas do calendário
      const activeDeliveries = allDeliveries.filter(d => d.estado !== 'concluido');

      activeDeliveries.forEach(d => {
        const workerName = d.worker?.name || (d.assigned_to ? `#${d.assigned_to}` : 'Sem camionista');

        if (d.data_saida) {
          const saida = d.data_saida.split('T')[0];
          addEvent(saida, {
            type: 'saida',
            label: `Saída • ${workerName}`,
            title: `Saída: ${workerName}\nOrigem: ${d.origem} → ${d.destino}`,
            delivery: d
          });

          // Mark transit days
          if (d.data_prevista) {
            const start = new Date(d.data_saida + 'T12:00:00');
            const end = new Date(d.data_prevista + 'T12:00:00');
            const transit = new Date(start);
            transit.setDate(transit.getDate() + 1);
            while (transit < end) {
              const ds = localDateStr(transit);
              addEvent(ds, {
                type: 'transit',
                label: `Trânsito • ${workerName}`,
                title: `Em trânsito: ${workerName}\n${d.origem} → ${d.destino}`,
                delivery: d
              });
              transit.setDate(transit.getDate() + 1);
            }
          }
        }

        if (d.data_prevista) {
          const prevista = d.data_prevista.split('T')[0];
          addEvent(prevista, {
            type: 'prevista',
            label: `Entrega • ${workerName}`,
            title: `Entrega prevista: ${workerName}\nDestino: ${d.destino}`,
            delivery: d
          });
        }
      });

      return map;
    }

    // ── Helper: formata uma Date como YYYY-MM-DD em hora local (evita desvio UTC) ──
    function localDateStr(d) {
      const y = d.getFullYear();
      const m = String(d.getMonth() + 1).padStart(2, '0');
      const day = String(d.getDate()).padStart(2, '0');
      return `${y}-${m}-${day}`;
    }

    function renderCalendar() {
      document.getElementById('monthLabel').textContent = `${monthNames[currentMonth]} ${currentYear}`;

      const eventMap = buildEventMap();
      const grid = document.getElementById('calGrid');
      grid.innerHTML = '';

      const today = new Date();
      const todayStr = localDateStr(today);

      // First day of the month and total days
      const firstDay = new Date(currentYear, currentMonth, 1).getDay();
      const daysInMonth = new Date(currentYear, currentMonth + 1, 0).getDate();
      const daysInPrev = new Date(currentYear, currentMonth, 0).getDate();

      // Total cells = enough rows to fill the grid (always complete weeks)
      const totalCells = Math.ceil((firstDay + daysInMonth) / 7) * 7;

      for (let i = 0; i < totalCells; i++) {
        const cell = document.createElement('div');
        cell.className = 'cal-day';

        let dayNum, dateStr, isOther = false;

        if (i < firstDay) {
          // Previous month
          dayNum = daysInPrev - firstDay + i + 1;
          const d = new Date(currentYear, currentMonth - 1, dayNum);
          dateStr = localDateStr(d);
          isOther = true;
        } else if (i >= firstDay + daysInMonth) {
          // Next month
          dayNum = i - firstDay - daysInMonth + 1;
          const d = new Date(currentYear, currentMonth + 1, dayNum);
          dateStr = localDateStr(d);
          isOther = true;
        } else {
          dayNum = i - firstDay + 1;
          const d = new Date(currentYear, currentMonth, dayNum);
          dateStr = localDateStr(d);
        }

        if (isOther) cell.classList.add('other-month');
        if (dateStr === todayStr) cell.classList.add('today');

        const numEl = document.createElement('div');
        numEl.className = 'day-number';
        numEl.textContent = dayNum;
        cell.appendChild(numEl);

        // Add events for this day
        const events = eventMap[dateStr] || [];

        // Sort: saida first, transit, prevista last
        const order = { saida: 0, transit: 1, prevista: 2 };
        events.sort((a, b) => order[a.type] - order[b.type]);

        // Limit to 3 visible, show "+N" if more
        const visible = events.slice(0, 3);
        const hidden = events.length - visible.length;

        visible.forEach(ev => {
          const tag = document.createElement('div');
          tag.className = `cal-event event-${ev.type}`;
          tag.textContent = ev.label;
          tag.setAttribute('title', ev.title);
          cell.appendChild(tag);
        });

        if (hidden > 0) {
          const more = document.createElement('div');
          more.style.cssText = 'font-size:11px;color:var(--text-secondary);padding:2px 4px;';
          more.textContent = `+${hidden} mais`;
          cell.appendChild(more);
        }

        grid.appendChild(cell);
      }
    }

    document.getElementById('logout').onclick = () => {
      localStorage.removeItem('user');
      window.location.href = 'index.html';
    };

    lucide.createIcons();
    loadDeliveries();

    // Sidebar toggle
    const hamburgerBtn = document.getElementById('hamburgerBtn');
    const sidebarOverlay = document.getElementById('sidebarOverlay');
    const sidebar = document.querySelector('.sidebar');
    function openSidebar() {
      sidebar.classList.add('open');
      sidebarOverlay.classList.add('active');
      document.body.style.overflow = 'hidden';
    }
    function closeSidebar() {
      sidebar.classList.remove('open');
      sidebarOverlay.classList.remove('active');
      document.body.style.overflow = '';
    }
    hamburgerBtn.addEventListener('click', openSidebar);
    sidebarOverlay.addEventListener('click', closeSidebar);
  </script>
</body>

</html>
