<!DOCTYPE html>
<html lang="pt-PT">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CamiGest - Dashboard</title>
  <link rel="icon" type="image/png" href="public/images/favicon.png">
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Outfit:wght@600;700;800&display=swap"
    rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="stylesheet" href="css/modern-design.css">
  <style>
    body {
      display: flex;
      min-height: 100vh;
      margin: 0;
      font-family: 'Inter', sans-serif;
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
      position: relative;
      overflow-x: hidden;
    }

    .sidebar {
      width: 260px;
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(20px);
      border-right: 1px solid rgba(255, 255, 255, 0.1);
      display: flex;
      flex-direction: column;
      padding: 24px 16px;
      position: fixed;
      height: 100vh;
      z-index: 100;
    }

    .sidebar-logo {
      text-align: center;
      margin-bottom: 40px;
      padding-bottom: 24px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }

    .sidebar-logo h2 {
      font-family: 'Outfit', sans-serif;
      font-size: 28px;
      font-weight: 800;
      background: linear-gradient(135deg, #3b82f6, #0ea5e9);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      margin: 0;
    }

    .sidebar ul {
      list-style: none;
      padding: 0;
      margin: 0;
      flex: 1;
    }

    .sidebar ul li {
      margin-bottom: 8px;
    }

    .sidebar ul li a {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px 16px;
      color: var(--text-secondary);
      text-decoration: none;
      border-radius: 12px;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      font-weight: 500;
      font-size: 15px;
      position: relative;
      overflow: hidden;
    }

    .sidebar ul li a::before {
      content: '';
      position: absolute;
      left: 0;
      top: 0;
      height: 100%;
      width: 3px;
      background: #2563eb;
      transform: scaleY(0);
      transition: transform 0.3s;
    }

    .sidebar ul li a:hover,
    .sidebar ul li a.active {
      background: rgba(37, 99, 235, 0.1);
      color: var(--text-primary);
      transform: translateX(4px);
    }

    .sidebar ul li a.active::before {
      transform: scaleY(1);
    }

    .sidebar-footer {
      padding-top: 24px;
      border-top: 1px solid rgba(255, 255, 255, 0.1);
    }

    #logout {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, #ef4444, #dc2626);
      border: none;
      border-radius: 12px;
      color: white;
      font-weight: 600;
      font-size: 15px;
      cursor: pointer;
      transition: all 0.3s;
      box-shadow: 0 4px 12px rgba(239, 68, 68, 0.3);
    }

    #logout:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(239, 68, 68, 0.5);
    }

    .main {
      flex: 1;
      margin-left: 260px;
      padding: 32px;
      animation: fadeInUp 0.6s ease-out;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 36px;
      padding: 24px;
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(10px);
      border-radius: 16px;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .header-left h1 {
      font-size: 28px;
      font-weight: 700;
      color: var(--text-primary);
      margin: 0 0 8px 0;
      font-family: 'Outfit', sans-serif;
    }

    .header-left span {
      font-size: 14px;
      color: var(--text-secondary);
      font-weight: 500;
    }

    #datetime {
      font-size: 14px;
      color: var(--text-muted);
      font-weight: 500;
      padding: 10px 16px;
      background: rgba(255, 255, 255, 0.05);
      border-radius: 8px;
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 24px;
      margin-bottom: 32px;
    }

    .card {
      background: linear-gradient(135deg, rgba(255, 255, 255, 0.1), rgba(255, 255, 255, 0.05));
      backdrop-filter: blur(10px);
      border-radius: 16px;
      padding: 24px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      position: relative;
      overflow: hidden;
      animation: fadeInUp 0.6s ease-out backwards;
    }

    .card:nth-child(1) {
      animation-delay: 0.1s;
    }

    .card:nth-child(2) {
      animation-delay: 0.2s;
    }

    .card:nth-child(3) {
      animation-delay: 0.3s;
    }

    .card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(135deg, rgba(37, 99, 235, 0.15), transparent);
      opacity: 0;
      transition: opacity 0.3s;
    }

    .card:hover::before {
      opacity: 1;
    }

    .card:hover {
      transform: translateY(-4px);
      box-shadow: 0 8px 24px rgba(37, 99, 235, 0.2);
      border-color: rgba(37, 99, 235, 0.3);
    }

    .card-icon {
      font-size: 36px;
      margin-bottom: 12px;
      display: block;
    }

    .card h3 {
      color: var(--text-secondary);
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 8px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .card p {
      font-size: 32px;
      font-weight: 800;
      background: linear-gradient(135deg, #3b82f6, #0ea5e9);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      margin: 0;
      font-family: 'Outfit', sans-serif;
    }

    .chart-container {
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(10px);
      border-radius: 16px;
      padding: 28px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      animation: fadeInUp 0.8s ease-out 0.4s backwards;
    }

    .chart-container h3 {
      font-size: 18px;
      font-weight: 700;
      color: var(--text-primary);
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      gap: 8px;
      font-family: 'Outfit', sans-serif;
    }

    canvas {
      width: 100% !important;
      height: 320px !important;
    }

    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(30px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @media (max-width: 1024px) {
      .sidebar {
        width: 220px;
      }

      .main {
        margin-left: 220px;
      }
    }

    @media (max-width: 768px) {
      .sidebar {
        transform: translateX(-100%);
      }

      .main {
        margin-left: 0;
        padding: 20px;
      }
    }
  </style>
</head>

<body>
  <nav class="sidebar">
    <div class="sidebar-logo">
      <h2><i data-lucide="truck"
          style="display: inline-block; width: 26px; height: 26px; vertical-align: middle; margin-right: 6px;"></i>CamiGest
      </h2>
    </div>
    <ul>
      <li><a href="dashboard.html" class="active"><i data-lucide="layout-dashboard"
            style="width: 18px; height: 18px;"></i> Dashboard</a></li>
      <li><a href="entregas.html"><i data-lucide="package" style="width: 18px; height: 18px;"></i> Entregas</a></li>
      <li><a href="camioes.html"><i data-lucide="truck" style="width: 18px; height: 18px;"></i> Camiões</a></li>
      <li><a href="config.html"><i data-lucide="settings" style="width: 18px; height: 18px;"></i> Configurações</a></li>
    </ul>
    <div class="sidebar-footer">
      <button id="logout"><i data-lucide="log-out" style="width: 18px; height: 18px; margin-right: 8px;"></i>Terminar
        Sessão</button>
    </div>
  </nav>

  <div class="main">
    <header>
      <div class="header-left">
        <h1>Bem-vindo, <span id="username">Utilizador</span> <i data-lucide="hand-wave"
            style="width: 28px; height: 28px; display: inline-block; vertical-align: middle;"></i></h1>
        <span id="role">Cargo</span>
      </div>
      <span id="datetime"></span>
    </header>

    <div class="cards">
      <div class="card">
        <span class="card-icon"><i data-lucide="check-circle"
            style="width: 36px; height: 36px; color: #059669;"></i></span>
        <h3>Entregas Concluídas</h3>
        <p id="completedDeliveries">25</p>
      </div>
      <div class="card">
        <span class="card-icon"><i data-lucide="truck" style="width: 36px; height: 36px; color: #3b82f6;"></i></span>
        <h3>Em Trânsito</h3>
        <p id="ongoingDeliveries">7</p>
      </div>
      <div class="card">
        <span class="card-icon"><i data-lucide="activity" style="width: 36px; height: 36px; color: #0ea5e9;"></i></span>
        <h3>Camiões Ativos</h3>
        <p id="activeTrucks">12</p>
      </div>
    </div>

    <div class="chart-container">
      <h3><i data-lucide="trending-up" style="width: 20px; height: 20px; margin-right: 8px;"></i>Entregas da Semana</h3>
      <canvas id="weeklyChart"></canvas>
    </div>
  </div>

  <script>
    function updateDateTime() {
      const now = new Date();
      const formatted = now.toLocaleString('pt-PT', {
        day: '2-digit', month: '2-digit', year: 'numeric',
        hour: '2-digit', minute: '2-digit', second: '2-digit'
      });
      document.getElementById('datetime').textContent = formatted;
    }
    setInterval(updateDateTime, 1000);
    updateDateTime();

    let user = null;
    try {
      user = JSON.parse(localStorage.getItem("user"));
    } catch (e) {
      console.error("Erro ao ler user:", e);
    }

    if (!user || !user.name) {
      window.location.href = "index.html";
    }

    document.getElementById("username").textContent = user.name;
    document.getElementById("role").textContent = user.role || "";

    document.getElementById("logout").addEventListener("click", () => {
      localStorage.removeItem("user");
      window.location.href = "index.html";
    });

    const ctx = document.getElementById('weeklyChart').getContext('2d');
    const gradient = ctx.createLinearGradient(0, 0, 0, 300);
    gradient.addColorStop(0, 'rgba(37, 99, 235, 0.3)');
    gradient.addColorStop(1, 'rgba(37, 99, 235, 0.05)');

    new Chart(ctx, {
      type: 'line',
      data: {
        labels: ['Seg', 'Ter', 'Qua', 'Qui', 'Sex', 'Sáb', 'Dom'],
        datasets: [{
          label: 'Entregas',
          data: [5, 7, 6, 8, 9, 10, 4],
          fill: true,
          borderColor: '#2563eb',
          backgroundColor: gradient,
          tension: 0.4,
          pointBackgroundColor: '#2563eb',
          pointBorderColor: '#fff',
          pointBorderWidth: 2,
          pointRadius: 5,
          pointHoverRadius: 7
        }]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        plugins: {
          legend: { display: false },
          tooltip: {
            backgroundColor: 'rgba(15, 23, 42, 0.9)',
            padding: 12,
            borderColor: 'rgba(102, 126, 234, 0.5)',
            borderWidth: 1,
            titleFont: { size: 14, weight: '600' },
            bodyFont: { size: 13 },
            cornerRadius: 8
          }
        },
        scales: {
          y: {
            beginAtZero: true,
            grid: {
              color: 'rgba(255, 255, 255, 0.05)',
              drawBorder: false
            },
            ticks: {
              color: '#94a3b8',
              font: { size: 12 }
            }
          },
          x: {
            grid: { display: false },
            ticks: {
              color: '#94a3b8',
              font: { size: 12, weight: '500' }
            }
          }
        }
      }
    });

    lucide.createIcons();
  </script>
</body>

</html>
