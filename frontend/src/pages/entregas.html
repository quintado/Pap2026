<!DOCTYPE html>
<html lang="pt-PT">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CamiGest - Entregas</title>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Outfit:wght@600;700;800&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="css/modern-design.css">
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="/public/js/custom-select.js"></script>
  <style>
    body {
      display: flex;
      min-height: 100vh;
      margin: 0;
      font-family: 'Inter', sans-serif;
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
      position: relative;
      overflow-x: hidden;
    }

    .sidebar {
      width: 260px;
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(20px);
      border-right: 1px solid rgba(255, 255, 255, 0.1);
      display: flex;
      flex-direction: column;
      padding: 24px 16px;
      position: fixed;
      height: 100vh;
      z-index: 100;
    }

    .sidebar-logo {
      text-align: center;
      margin-bottom: 40px;
      padding-bottom: 24px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }

    .sidebar-logo h2 {
      font-family: 'Outfit', sans-serif;
      font-size: 28px;
      font-weight: 800;
      background: linear-gradient(135deg, #667eea, #f093fb);
      -webkit-background-clip: text;
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      margin: 0;
    }

    .sidebar ul {
      list-style: none;
      padding: 0;
      margin: 0;
      flex: 1;
    }

    .sidebar ul li {
      margin-bottom: 8px;
    }

    .sidebar ul li a {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px 16px;
      color: var(--text-secondary);
      text-decoration: none;
      border-radius: 12px;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      font-weight: 500;
      font-size: 15px;
      position: relative;
      overflow: hidden;
    }

    .sidebar ul li a::before {
      content: '';
      position: absolute;
      left: 0;
      top: 0;
      height: 100%;
      width: 3px;
      background: linear-gradient(180deg, #667eea, #764ba2);
      transform: scaleY(0);
      transition: transform 0.3s;
    }

    .sidebar ul li a:hover,
    .sidebar ul li a.active {
      background: rgba(102, 126, 234, 0.15);
      color: var(--text-primary);
      transform: translateX(4px);
    }

    .sidebar ul li a.active::before {
      transform: scaleY(1);
    }

    .sidebar-footer {
      padding-top: 24px;
      border-top: 1px solid rgba(255, 255, 255, 0.1);
    }

    #logout {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, #ef4444, #dc2626);
      border: none;
      border-radius: 12px;
      color: white;
      font-weight: 600;
      font-size: 15px;
      cursor: pointer;
      transition: all 0.3s;
      box-shadow: 0 4px 12px rgba(239, 68, 68, 0.3);
    }

    #logout:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(239, 68, 68, 0.5);
    }

    .main {
      flex: 1;
      margin-left: 260px;
      padding: 32px;
      animation: fadeInUp 0.6s ease-out;
    }

    .header-section {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 32px;
    }

    h1 {
      font-size: 28px;
      font-weight: 700;
      color: var(--text-primary);
      margin: 0;
      font-family: 'Outfit', sans-serif;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .add-btn {
      background: linear-gradient(135deg, #667eea, #764ba2);
      color: white;
      padding: 12px 24px;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      font-weight: 600;
      font-size: 15px;
      transition: all 0.3s;
      box-shadow: 0 4px 12px rgba(102, 126, 234, 0.3);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .add-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(102, 126, 234, 0.5);
    }

    .header-actions {
      display: flex;
      gap: 12px;
      align-items: center;
      position: relative;
    }

    .notification-btn {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: white;
      padding: 12px;
      border-radius: 12px;
      cursor: pointer;
      position: relative;
      transition: all 0.3s;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .notification-btn:hover {
      background: rgba(255, 255, 255, 0.15);
      transform: translateY(-2px);
    }

    .notification-badge {
      position: absolute;
      top: -5px;
      right: -5px;
      background: #ef4444;
      color: white;
      font-size: 10px;
      font-weight: 700;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      display: none;
      align-items: center;
      justify-content: center;
      border: 2px solid #0f172a;
    }

    .notification-badge.active {
      display: flex;
    }

    .request-item {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.05);
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 12px;
    }

    .request-info {
      margin-bottom: 12px;
    }

    .request-info p {
      margin: 4px 0;
      font-size: 14px;
      color: var(--text-secondary);
    }

    .request-info strong {
      color: var(--text-primary);
    }

    .request-actions {
      display: flex;
      gap: 8px;
    }

    .request-actions button {
      flex: 1;
      padding: 8px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s;
    }

    .btn-approve {
      background: rgba(34, 197, 94, 0.2);
      color: #4ade80;
      border: 1px solid rgba(34, 197, 94, 0.4);
    }

    .btn-approve:hover {
      background: rgba(34, 197, 94, 0.3);
    }

    .btn-reject {
      background: rgba(239, 68, 68, 0.2);
      color: #f87171;
      border: 1px solid rgba(239, 68, 68, 0.4);
    }

    .btn-reject:hover {
      background: rgba(239, 68, 68, 0.3);
    }

    .btn-details {
      background: rgba(255, 255, 255, 0.08);
      color: var(--text-primary);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .btn-details:hover {
      background: rgba(255, 255, 255, 0.15);
    }

    .notification-dropdown {
      position: absolute;
      top: 100%;
      right: 0;
      width: 350px;
      background: rgba(30, 41, 59, 0.95);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 16px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
      margin-top: 12px;
      display: none;
      flex-direction: column;
      z-index: 1000;
      overflow: hidden;
      animation: slideIn 0.3s;
    }

    .notification-dropdown.active {
      display: flex;
    }

    .dropdown-header {
      padding: 16px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .dropdown-header h3 {
      margin: 0;
      font-size: 16px;
      font-family: 'Outfit', sans-serif;
    }

    .dropdown-body {
      max-height: 400px;
      overflow-y: auto;
      padding: 12px;
    }

    .dropdown-body::-webkit-scrollbar {
      width: 6px;
    }

    .dropdown-body::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.1);
      border-radius: 3px;
    }

    .filters-section {
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(10px);
      border-radius: 16px;
      padding: 20px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      margin-bottom: 20px;
      display: flex;
      gap: 16px;
      flex-wrap: wrap;
    }

    .filter-group {
      flex: 1;
      min-width: 200px;
    }

    .filter-group label {
      display: block;
      color: var(--text-secondary);
      font-size: 13px;
      font-weight: 500;
      margin-bottom: 6px;
    }

    .filter-group input,
    .filter-group select {
      width: 100%;
      padding: 10px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 10px;
      font-size: 14px;
      color: var(--text-primary);
      transition: all 0.3s;
    }

    /* Ensure select control and its options use dark background and visible text */
    .filter-group input {
      position: relative;
      z-index: 1;
    }

    .filter-group select {
      width: 100%;
      padding: 10px;
      background-color: #0f172a !important;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 10px;
      font-size: 14px;
      color: #ffffff !important;
      -webkit-text-fill-color: #ffffff !important;
      transition: all 0.3s;
      position: relative;
      z-index: 2000;
    }

    /* Force option styles (may be ignored by some native UAs) */
    .filter-group select option {
      background-color: #1e293b !important;
      color: #ffffff !important;
    }

    .filter-group input:focus,
    .filter-group select:focus {
      outline: none;
      border-color: rgba(102, 126, 234, 0.5);
      background: rgba(255, 255, 255, 0.12);
    }

    .table-container {
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(10px);
      border-radius: 16px;
      padding: 28px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      animation: fadeInUp 0.8s ease-out 0.2s backwards;
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 15px;
    }

    th,
    td {
      text-align: left;
      padding: 14px 12px;
    }

    th {
      background: linear-gradient(135deg, rgba(102, 126, 234, 0.3), rgba(102, 126, 234, 0.2));
      color: var(--text-primary);
      font-weight: 600;
      font-size: 14px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    td {
      color: var(--text-secondary);
      font-size: 15px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
    }

    tr:hover td {
      background-color: rgba(102, 126, 234, 0.1);
      transition: background-color 0.3s;
    }

    .badge {
      padding: 6px 12px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 600;
      display: inline-block;
    }

    .badge.pendente {
      background: rgba(250, 204, 21, 0.2);
      color: #fbbf24;
      border: 1px solid rgba(250, 204, 21, 0.4);
    }

    .badge.em-curso {
      background: rgba(59, 130, 246, 0.2);
      color: #60a5fa;
      border: 1px solid rgba(59, 130, 246, 0.4);
    }

    .badge.concluido {
      background: rgba(34, 197, 94, 0.2);
      color: #4ade80;
      border: 1px solid rgba(34, 197, 94, 0.4);
    }

    .badge.cancelado {
      background: rgba(239, 68, 68, 0.2);
      color: #f87171;
      border: 1px solid rgba(239, 68, 68, 0.4);
    }

    .action-btn {
      background: rgba(102, 126, 234, 0.2);
      border: 1px solid rgba(102, 126, 234, 0.4);
      color: var(--text-primary);
      padding: 6px 12px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 12px;
      font-weight: 600;
      transition: all 0.3s;
      margin-right: 6px;
    }

    .action-btn:hover {
      background: rgba(102, 126, 234, 0.3);
      transform: translateY(-1px);
    }

    .action-btn.delete {
      background: rgba(239, 68, 68, 0.2);
      border: 1px solid rgba(239, 68, 68, 0.4);
    }

    .action-btn.delete:hover {
      background: rgba(239, 68, 68, 0.3);
    }

    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(5px);
      justify-content: center;
      align-items: center;
      z-index: 1000;
      animation: fadeIn 0.3s;
    }

    .modal-content {
      background: linear-gradient(135deg, rgba(30, 41, 59, 0.95), rgba(15, 23, 42, 0.95));
      backdrop-filter: blur(20px);
      padding: 30px;
      border-radius: 16px;
      width: 500px;
      max-width: 90%;
      border: 1px solid rgba(255, 255, 255, 0.1);
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
      animation: slideIn 0.3s;
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
    }

    .modal-header h2 {
      color: var(--text-primary);
      font-family: 'Outfit', sans-serif;
      margin: 0;
      font-size: 22px;
    }

    .close-btn {
      background: none;
      border: none;
      color: var(--text-secondary);
      font-size: 24px;
      cursor: pointer;
      transition: all 0.3s;
    }

    .close-btn:hover {
      color: var(--text-primary);
      transform: rotate(90deg);
    }

    .form-group {
      margin-bottom: 16px;
    }

    .form-group label {
      display: block;
      color: var(--text-secondary);
      font-size: 14px;
      font-weight: 500;
      margin-bottom: 6px;
    }

    .form-group input,
    .form-group select,
    .form-group textarea {
      width: 100%;
      padding: 12px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 10px;
      font-size: 14px;
      color: var(--text-primary);
      transition: all 0.3s;
      font-family: 'Inter', sans-serif;
    }

    .form-group textarea {
      resize: vertical;
      min-height: 80px;
    }

    .form-group input:focus,
    .form-group select:focus,
    .form-group textarea:focus {
      outline: none;
      border-color: rgba(102, 126, 234, 0.5);
      background: rgba(255, 255, 255, 0.12);
    }

    .form-group select option {
      background-color: #1e293b;
      color: white;
    }

    .modal-actions {
      display: flex;
      gap: 12px;
      margin-top: 24px;
    }

    .btn-primary {
      flex: 1;
      background: linear-gradient(135deg, #667eea, #764ba2);
      color: white;
      padding: 12px;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      font-weight: 600;
      transition: all 0.3s;
      box-shadow: 0 4px 12px rgba(102, 126, 234, 0.3);
    }

    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(102, 126, 234, 0.5);
    }

    .btn-secondary {
      flex: 1;
      background: rgba(255, 255, 255, 0.08);
      color: var(--text-primary);
      padding: 12px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 10px;
      cursor: pointer;
      font-weight: 600;
      transition: all 0.3s;
    }

    .btn-secondary:hover {
      background: rgba(255, 255, 255, 0.12);
    }

    .empty-state {
      text-align: center;
      padding: 40px;
      color: var(--text-secondary);
    }

    .empty-state svg {
      width: 80px;
      height: 80px;
      margin-bottom: 16px;
      opacity: 0.5;
    }

    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(30px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
      }

      to {
        opacity: 1;
      }
    }

    @keyframes slideIn {
      from {
        transform: translateY(-20px);
        opacity: 0;
      }

      to {
        transform: translateY(0);
        opacity: 1;
      }
    }

    @media (max-width: 1024px) {
      .sidebar {
        width: 220px;
      }

      .main {
        margin-left: 220px;
      }
    }

    @media (max-width: 768px) {
      .sidebar {
        transform: translateX(-100%);
      }

      .main {
        margin-left: 0;
        padding: 20px;
      }

      .header-section {
        flex-direction: column;
        align-items: flex-start;
        gap: 16px;
      }
    }

    /* Custom select component styles */
    .custom-select-wrapper {
      position: relative;
      width: 100%;
    }

    .custom-select-selected {
      background: #0f172a;
      color: #fff;
      padding: 10px;
      border-radius: 10px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      cursor: pointer;
      user-select: none;
    }

    .custom-select-options {
      position: absolute;
      left: 0;
      right: 0;
      top: calc(100% + 6px);
      background: #1e293b;
      border-radius: 8px;
      max-height: 240px;
      overflow: auto;
      box-shadow: 0 10px 30px rgba(2, 6, 23, 0.6);
      z-index: 3000;
      display: none;
      padding: 6px 0;
    }

    .custom-select-options.open {
      display: block;
    }

    .custom-select-option {
      padding: 10px 14px;
      color: #fff;
      list-style: none;
      cursor: pointer;
    }

    .custom-select-option:hover {
      background: rgba(255, 255, 255, 0.03);
    }

    .custom-select-option.selected {
      background: rgba(255, 255, 255, 0.06);
    }

    .feedback-modal-bg {
      position: fixed;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      background: rgba(0, 0, 0, 0.7);
      z-index: 11000;
      padding: 24px;
      opacity: 0;
      transition: opacity 0.24s ease;
    }

    .feedback-modal-bg.show {
      display: flex;
      opacity: 1;
    }

    .feedback-modal-content {
      width: min(480px, 100%);
      background: linear-gradient(135deg, rgba(15, 23, 42, 0.98), rgba(30, 41, 59, 0.98));
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 24px;
      box-shadow: 0 30px 80px rgba(0, 0, 0, 0.4);
      padding: 32px 30px;
      text-align: center;
      transform: translateY(-20px) scale(0.98);
      opacity: 0;
      transition: transform 0.24s ease, opacity 0.24s ease;
    }

    .feedback-modal-bg.show .feedback-modal-content {
      transform: translateY(0) scale(1);
      opacity: 1;
    }

    .feedback-modal-icon {
      width: 60px;
      height: 60px;
      margin: 0 auto 20px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      background: rgba(34, 197, 94, 0.15);
      color: #22c55e;
      font-size: 28px;
    }

    .feedback-modal-title {
      margin: 0 0 12px;
      font-size: 26px;
      color: #f8fafc;
      font-weight: 800;
    }

    .feedback-modal-text {
      margin: 0 0 28px;
      color: rgba(248, 250, 252, 0.8);
      font-size: 15px;
      line-height: 1.6;
      white-space: pre-wrap;
    }

    .feedback-modal-button {
      background: linear-gradient(135deg, #6366f1, #818cf8);
      color: white;
      border: none;
      border-radius: 14px;
      padding: 14px 24px;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .feedback-modal-button:hover {
      transform: translateY(-1px);
      box-shadow: 0 12px 28px rgba(99, 102, 241, 0.25);
    }

    .swal2-popup {
      background: linear-gradient(135deg, rgba(15, 23, 42, 0.98), rgba(30, 41, 59, 0.98)) !important;
      border: 1px solid rgba(255, 255, 255, 0.12) !important;
      box-shadow: 0 30px 80px rgba(0, 0, 0, 0.4) !important;
    }

    .swal2-title {
      color: #f8fafc !important;
      font-weight: 800 !important;
      font-size: 26px !important;
    }

    .swal2-html-container {
      color: rgba(248, 250, 252, 0.8) !important;
    }

    .swal2-html-container p {
      margin: 0 !important;
    }

    .swal2-confirm,
    .swal2-cancel {
      font-weight: 700 !important;
      border-radius: 14px !important;
      padding: 14px 24px !important;
    }

    .swal2-icon {
      border-color: rgba(255, 165, 0, 0.3) !important;
      color: #ffa500 !important;
    }

    .swal2-icon.swal2-warning {
      background-color: rgba(255, 165, 0, 0.08) !important;
    }

    .swal2-icon.swal2-error {
      background-color: rgba(239, 68, 68, 0.08) !important;
      border-color: rgba(239, 68, 68, 0.3) !important;
      color: #f87171 !important;
    }

    .swal2-icon.swal2-success {
      background-color: rgba(34, 197, 94, 0.08) !important;
      border-color: rgba(34, 197, 94, 0.3) !important;
      color: #22c55e !important;
    }
  </style>
</head>

<body>

  <div id="feedbackModalBg" class="feedback-modal-bg"
    onclick="if(event.target.id==='feedbackModalBg') closeFeedbackModal()">
    <div class="feedback-modal-content">
      <div class="feedback-modal-icon" id="feedbackModalIcon"><i data-lucide="check" style="width:28px;height:28px;"></i></div>
      <h2 class="feedback-modal-title" id="feedbackModalTitle">Sucesso!</h2>
      <p class="feedback-modal-text" id="feedbackModalMessage">Entrega criada com sucesso!</p>
      <button class="feedback-modal-button" onclick="closeFeedbackModal()">OK</button>
    </div>
  </div>

  <nav class="sidebar">
    <div class="sidebar-logo">
      <h2><i data-lucide="truck"
          style="display: inline-block; width: 26px; height: 26px; vertical-align: middle; margin-right: 6px;"></i>CamiGest
      </h2>
    </div>
    <ul>

  <div class="modal" id="finishDeliveryModal">
    <div class="modal-content">

        <h2>Finalizar Entrega</h2>
        <button class="close-btn" onclick="closeFinishModal()">×</button>
      </div>
      <form id="finishDeliveryForm">
        <input type="hidden" id="finishDeliveryId">
        <input type="hidden" id="finishTruckId">
        <div class="form-group">
          <label>Quilometragem Final *</label>
          <input type="number" id="finalMileage" required placeholder="Ex: 125500">
        </div>
        <div class="modal-actions">

          <button type="submit" class="btn-primary">Finalizar Entrega</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    const user = JSON.parse(localStorage.getItem("user"));
    if (!user) window.location.href = "index.html";

    const isManager = user.role?.toLowerCase() === "ceo" || user.role?.toLowerCase() === "supervisor";
    const isWorker = user.role?.toLowerCase() === "camionista";
    let editingDeliveryId = null;
    let allDeliveries = [];

    if (isManager) {
      document.getElementById("addDeliveryBtn").style.display = "flex";
      document.getElementById("requestNotifyBtn").style.display = "flex";
      loadPendingRequests();
      setInterval(loadPendingRequests, 30000);
    }

    document.getElementById("actionsHeader").style.display = "table-cell";

    async function loadDeliveries() {
      try {
        const company = (user.company || "").trim();
        const url = `/deliveries?company=${encodeURIComponent(company)}`;
        const res = await fetch(url);
        const data = await res.json();

        if (!res.ok) {
          showEmptyState();
          return;
        }

        if (!Array.isArray(data)) {
          showEmptyState();
          return;
        }

        allDeliveries = data;
        renderDeliveries(allDeliveries);
      } catch (err) {
        showEmptyState();
      }
    }

    function renderDeliveries(deliveries) {
      const tbody = document.getElementById("deliveriesTableBody");
      tbody.innerHTML = "";

      const visibleDeliveries = deliveries.filter(delivery => {
        if (delivery.estado === 'concluido' && !isManager) {
          return false;
        }
        // Entregas em curso só visíveis ao trabalhador atribuído (gestores vêem sempre)
        if (delivery.estado === 'em-curso' && isWorker && delivery.assigned_to !== user.id) {
          return false;
        }
        return true;
      });

      if (visibleDeliveries.length === 0) {
        showEmptyState();
        return;
      }

      visibleDeliveries.forEach(delivery => {
        const tr = document.createElement("tr");
        const dataSaida = delivery.data_saida ? new Date(delivery.data_saida).toLocaleDateString('pt-PT') : "—";
        const dataPrevista = delivery.data_prevista ? new Date(delivery.data_prevista).toLocaleDateString('pt-PT') : "N/A";

        let workerInfo = "";
        if (delivery.worker) {
          workerInfo = `
            <div style="color: var(--text-primary); font-weight: 600; font-size: 13px;">Camionista</div>
            <div style="font-size: 14px; color: #60a5fa;">${delivery.worker.name}</div>
          `;
        } else if (delivery.assigned_to) {
          workerInfo = `
            <div style="color: var(--text-primary); font-weight: 600; font-size: 13px;">Camionista (ID: ${delivery.assigned_to})</div>
            <div style="font-size: 14px; color: #f59e0b;">Nome não carregado</div>
          `;
        } else {
          workerInfo = `<div style="color: #f87171; font-size: 13px; font-weight: 500; opacity: 0.8;">⏳ Ainda não foi aceite</div>`;
        }

        const tipo = delivery.tipo || "N/A";
        const origem = delivery.origem || "N/A";
        const destino = delivery.destino || "N/A";
        const estado = delivery.estado || "pendente";

        tr.innerHTML = `
          <td>${tipo}</td>
          <td>${origem}</td>
          <td>${destino}</td>
          <td><span class="badge ${estado}">${formatEstado(estado)}</span></td>
          <td>${dataSaida}</td>
          <td>${dataPrevista}</td>
          <td>
            <div style="margin-bottom: 8px;">${workerInfo}</div>
            <div style="display: flex; gap: 4px; flex-wrap: wrap;">
              ${isManager ? `
                <button class="action-btn" onclick="editDelivery(${delivery.id})" title="Editar"><svg xmlns='http://www.w3.org/2000/svg' width='14' height='14' viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><path d='M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7'/><path d='M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z'/></svg></button>
                <button class="action-btn delete" onclick="deleteDelivery(${delivery.id})" title="Eliminar"><svg xmlns='http://www.w3.org/2000/svg' width='14' height='14' viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><polyline points='3 6 5 6 21 6'/><path d='M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6'/><path d='M10 11v6'/><path d='M14 11v6'/><path d='M9 6V4h6v2'/></svg></button>
              ` : ''}
              ${isWorker && delivery.estado === 'pendente' ? `
                <button class="action-btn" onclick="openRequestModal(${delivery.id})"><svg xmlns='http://www.w3.org/2000/svg' width='14' height='14' viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><rect x='1' y='3' width='15' height='13'/><polygon points='16 8 20 8 23 11 23 16 16 16 16 8'/><circle cx='5.5' cy='18.5' r='2.5'/><circle cx='18.5' cy='18.5' r='2.5'/></svg> Pedir Entrega</button>
              ` : ''}
              ${(isManager || (isWorker && delivery.assigned_to === user.id)) && delivery.estado === 'em-curso' ? `
                <button class="action-btn" style="background: rgba(34, 197, 94, 0.2); color: #4ade80; border-color: rgba(34, 197, 94, 0.4);" onclick="openFinishModal(${delivery.id}, ${delivery.truck_id})" title="Finalizar Entrega"><svg xmlns='http://www.w3.org/2000/svg' width='14' height='14' viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><path d='M4 15s1-1 4-1 5 2 8 2 4-1 4-1V3s-1 1-4 1-5-2-8-2-4 1-4 1z'/><line x1='4' y1='22' x2='4' y2='15'/></svg> Finalizar</button>
              ` : ''}
            </div>
          </td>
        `;

        tbody.appendChild(tr);
      });
    }

    function formatEstado(estado) {
      const map = {
        'pendente': 'Pendente',
        'em-curso': 'Em Curso',
        'concluido': 'Concluído',
        'cancelado': 'Cancelado'
      };
      return map[estado] || estado;
    }

    function showEmptyState() {
      const tbody = document.getElementById("deliveriesTableBody");
      tbody.innerHTML = `<tr><td colspan="${isManager ? 6 : 5}" class="empty-state"><div>📦</div><p>Nenhuma entrega encontrada</p></td></tr>`;
    }

    document.getElementById("searchOrigem").addEventListener("input", applyFilters);
    document.getElementById("searchDestino").addEventListener("input", applyFilters);
    document.getElementById("searchWorker").addEventListener("input", applyFilters);
    document.getElementById("statusFilter").addEventListener("change", applyFilters);

    function applyFilters() {
      const searchOrigem = document.getElementById("searchOrigem").value.toLowerCase().trim();
      const searchDestino = document.getElementById("searchDestino").value.toLowerCase().trim();
      const searchWorker = document.getElementById("searchWorker").value.toLowerCase().trim();
      const statusFilter = document.getElementById("statusFilter").value;

      const filtered = allDeliveries.filter(delivery => {
        const origem = (delivery.origem || "").toLowerCase();
        const destino = (delivery.destino || "").toLowerCase();
        const estado = delivery.estado || "pendente";
        const workerName = (delivery.worker?.name || "").toLowerCase();

        const matchesOrigem = !searchOrigem || origem.includes(searchOrigem);
        const matchesDestino = !searchDestino || destino.includes(searchDestino);
        const matchesWorker = !searchWorker || workerName.includes(searchWorker);
        const matchesStatus = !statusFilter || estado === statusFilter;

        return matchesOrigem && matchesDestino && matchesWorker && matchesStatus;
      });

      renderDeliveries(filtered);
    }

    document.getElementById("addDeliveryBtn").addEventListener("click", () => {
      editingDeliveryId = null;
      document.getElementById("modalTitle").textContent = "Nova Entrega";
      document.getElementById("deliveryForm").reset();
      document.getElementById("deliveryModal").style.display = "flex";
    });

    function closeModal() {
      document.getElementById("deliveryModal").style.display = "none";
      editingDeliveryId = null;
    }

    async function editDelivery(id) {
      const delivery = allDeliveries.find(d => d.id === id);
      if (!delivery) return;

      editingDeliveryId = id;
      document.getElementById("modalTitle").textContent = "Editar Entrega";
      document.getElementById("tipo").value = delivery.tipo;
      document.getElementById("origem").value = delivery.origem;
      document.getElementById("destino").value = delivery.destino;
      document.getElementById("estado").value = delivery.estado;

      if (delivery.data_saida) {
        document.getElementById("dataSaida").value = new Date(delivery.data_saida).toISOString().split('T')[0];
      } else {
        document.getElementById("dataSaida").value = "";
      }

      if (delivery.data_prevista) {
        document.getElementById("dataPrevista").value = new Date(delivery.data_prevista).toISOString().split('T')[0];
      } else {
        document.getElementById("dataPrevista").value = "";
      }

      document.getElementById("observacoes").value = delivery.observacoes || "";
      document.getElementById("deliveryModal").style.display = "flex";
    }

    document.getElementById("deliveryForm").addEventListener("submit", async (e) => {
      e.preventDefault();

      const dataSaida = document.getElementById("dataSaida").value;
      const dataPrevista = document.getElementById("dataPrevista").value;

      // Validar datas no cliente
      if (dataSaida && dataPrevista && new Date(dataSaida) >= new Date(dataPrevista)) {
        showFeedbackModal('Atenção', 'A data de saída deve ser anterior à data prevista.', false);
        return;
      }

      const data = {
        tipo: document.getElementById("tipo").value,
        origem: document.getElementById("origem").value,
        destino: document.getElementById("destino").value,
        estado: document.getElementById("estado").value,
        dataSaida: dataSaida || null,
        dataPrevista: dataPrevista || null,
        observacoes: document.getElementById("observacoes").value,
        [editingDeliveryId ? 'updatedBy' : 'createdBy']: user.id
      };

      const apiUrl = window.location.origin;
      const url = editingDeliveryId ? `${apiUrl}/update-delivery/${editingDeliveryId}` : `${apiUrl}/create-delivery`;
      const method = editingDeliveryId ? "PUT" : "POST";

      try {
        const res = await fetch(url, {
          method,
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(data)
        });

        const result = await res.json();
        if (!res.ok) {
          showFeedbackModal('Erro', result.message || 'Erro ao guardar entrega.', false);
          return;
        }

        const msgTitle = editingDeliveryId ? 'Sucesso!' : 'Sucesso!';
        const msgText = editingDeliveryId ? 'Entrega atualizada com sucesso!' : 'Entrega criada com sucesso!';
        showFeedbackModal(msgTitle, msgText, true);
        closeModal();
        loadDeliveries();
      } catch (err) {
        showFeedbackModal('Erro', 'Erro ao guardar entrega: ' + err.message, false);
      }
    });

    async function deleteDelivery(id) {
      const result = await Swal.fire({
        title: 'Eliminar entrega',
        html: '<p>Tem a certeza que deseja eliminar esta entrega? Esta ação não pode ser desfeita.</p>',
        icon: 'warning',
        showCancelButton: true,
        confirmButtonText: 'Eliminar definitivamente',
        cancelButtonText: 'Cancelar',
        confirmButtonColor: '#dc2626',
        cancelButtonColor: '#9ca3af',
        reverseButtons: true
      });

      if (!result.isConfirmed) return;

      try {
        const apiUrl = window.location.origin;
        const res = await fetch(`${apiUrl}/delete-delivery/${id}`, {
          method: "DELETE",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ deletedBy: user.id })
        });

        const body = await res.json();
        if (!res.ok) {
          Swal.fire({ title: 'Erro', text: body.message || 'Erro ao eliminar entrega', icon: 'error', confirmButtonColor: '#667eea' });
          return;
        }

        await Swal.fire({ title: 'Eliminado', text: body.message, icon: 'success', timer: 1400, showConfirmButton: false });
        loadDeliveries();
      } catch (err) {
        Swal.fire({ title: 'Erro', text: 'Erro ao eliminar entrega: ' + err.message, icon: 'error', confirmButtonColor: '#667eea' });
      }
    }

    document.getElementById("logout").addEventListener("click", () => {
      localStorage.removeItem("user");
      window.location.href = "index.html";
    });

    document.getElementById("deliveryModal").addEventListener("click", (e) => {
      if (e.target.id === "deliveryModal") closeModal();
    });

    async function openRequestModal(deliveryId) {
      document.getElementById("requestDeliveryId").value = deliveryId;
      document.getElementById("requestDeliveryModal").style.display = "flex";

      const select = document.getElementById("requestTruckId");
      select.innerHTML = '<option value="">A carregar camiões...</option>';
      CustomSelect.refresh(select);
      select.disabled = true;
      CustomSelect.setDisabled(select, true);

      // Timeout de 10 segundos para evitar carregamento infinito
      const controller = new AbortController();
      const timeoutId = setTimeout(() => controller.abort(), 10000);

      try {
        const apiUrl = window.location.origin;
        const company = encodeURIComponent((user.company || '').trim());
        const fetchUrl = `${apiUrl}/trucks?status=disponivel&company=${company}`;
        console.log('[openRequestModal] A buscar camiões:', fetchUrl);

        const res = await fetch(fetchUrl, { signal: controller.signal });
        clearTimeout(timeoutId);

        console.log('[openRequestModal] Resposta HTTP:', res.status);

        if (!res.ok) {
          let errMsg = `Erro do servidor (${res.status})`;
          try { const errBody = await res.json(); errMsg = errBody.message || errMsg; } catch (_) { }
          console.error('[openRequestModal] Erro HTTP:', errMsg);
          select.innerHTML = `<option value="">${errMsg}</option>`;
          CustomSelect.refresh(select);
          select.disabled = false;
          CustomSelect.setDisabled(select, false);
          return;
        }

        const trucks = await res.json();
        console.log('[openRequestModal] Camiões recebidos:', trucks);

        // O backend já filtra por status=disponivel; não é necessário re-filtrar
        if (!Array.isArray(trucks) || trucks.length === 0) {
          select.innerHTML = '<option value="">Nenhum camião disponível de momento</option>';
        } else {
          select.innerHTML = '<option value="">Selecione um camião...</option>';
          trucks.forEach(t => {
            const opt = document.createElement("option");
            opt.value = t.id;
            opt.textContent = `${t.plate} — ${t.model} (${t.mileage ? t.mileage.toLocaleString('pt-PT') + ' km' : 'km N/D'})`;
            select.appendChild(opt);
          });
        }
        CustomSelect.refresh(select);
      } catch (err) {
        clearTimeout(timeoutId);
        console.error('[openRequestModal] Erro ao carregar camiões:', err);
        const msg = err.name === 'AbortError'
          ? 'Tempo de espera esgotado. Verifique a ligação ao servidor.'
          : 'Erro ao carregar camiões: ' + (err.message || 'Erro desconhecido');
        select.innerHTML = `<option value="">${msg}</option>`;
        CustomSelect.refresh(select);
      } finally {
        select.disabled = false;
        CustomSelect.setDisabled(select, false);
      }
    }

    function closeRequestModal() {
      document.getElementById("requestDeliveryModal").style.display = "none";
      document.getElementById("requestDeliveryForm").reset();
    }

    document.getElementById("requestDeliveryForm").addEventListener("submit", async (e) => {
      e.preventDefault();

      const deliveryId = document.getElementById("requestDeliveryId").value;
      const truckId = document.getElementById("requestTruckId").value;

      if (!truckId) {
        showFeedbackModal('Atenção', 'Por favor selecione um camião.', false);
        return;
      }

      try {
        const apiUrl = window.location.origin;
        const res = await fetch(`${apiUrl}/request-delivery`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            deliveryId: parseInt(deliveryId),
            truckId: parseInt(truckId),
            workerId: user.id
          })
        });

        const data = await res.json();
        if (res.ok) {
          showFeedbackModal('Sucesso!', 'Pedido enviado com sucesso!', true);
          closeRequestModal();
          loadDeliveries();
        } else {
          showFeedbackModal('Erro', 'Erro: ' + data.message, false);
        }
      } catch (err) {
        showFeedbackModal('Erro', 'Erro ao enviar pedido: ' + err.message, false);
      }
    });

    let pendingRequests = [];

    async function loadPendingRequests() {
      if (!isManager) return;

      try {
        const apiUrl = window.location.origin;
        const res = await fetch(`${apiUrl}/pending-requests?company=${user.company}`);
        pendingRequests = await res.json();
        updateNotificationBadge();
      } catch (err) {
        console.error("Erro ao carregar solicitações:", err);
      }
    }

    function updateNotificationBadge() {
      const badge = document.getElementById("notifyBadge");
      const count = pendingRequests.length;
      badge.textContent = count;

      if (count > 0) {
        badge.classList.add("active");
      } else {
        badge.classList.remove("active");
      }
    }

    document.getElementById("requestNotifyBtn").addEventListener("click", (e) => {
      e.stopPropagation();
      toggleDropdown();
    });

    function toggleDropdown() {
      const dropdown = document.getElementById("notificationDropdown");
      const isActive = dropdown.classList.toggle("active");

      if (isActive) {
        renderRequestsList();
      }
    }

    document.addEventListener("click", (e) => {
      const dropdown = document.getElementById("notificationDropdown");
      const btn = document.getElementById("requestNotifyBtn");

      if (dropdown.classList.contains("active") && !dropdown.contains(e.target) && !btn.contains(e.target)) {
        dropdown.classList.remove("active");
      }
    });

    function renderRequestsList() {
      const container = document.getElementById("dropdownBody");
      container.innerHTML = "";

      if (pendingRequests.length === 0) {
        container.innerHTML = '<p style="text-align: center; color: var(--text-secondary); padding: 20px;">Nenhuma solicitação pendente.</p>';
        return;
      }

      pendingRequests.forEach(req => {
        const item = document.createElement("div");
        item.className = "request-item";

        item.innerHTML = `
          <div class="request-info">
            <p><strong>Motorista:</strong> ${req.worker?.name || 'Desconhecido'}</p>
          </div>
          <div class="request-actions">
            <button class="btn-details" onclick="openDetailModal(${req.id})"><svg xmlns='http://www.w3.org/2000/svg' width='14' height='14' viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='2' stroke-linecap='round' stroke-linejoin='round' style='display:inline;margin-right:4px'><circle cx='11' cy='11' r='8'/><line x1='21' y1='21' x2='16.65' y2='16.65'/></svg>Detalhes</button>
            <button class="btn-approve" onclick="respondRequest(${req.id}, true)"><svg xmlns='http://www.w3.org/2000/svg' width='14' height='14' viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='2' stroke-linecap='round' stroke-linejoin='round' style='display:inline;margin-right:4px'><polyline points='20 6 9 17 4 12'/></svg>Aceitar</button>
            <button class="btn-reject" onclick="respondRequest(${req.id}, false)"><svg xmlns='http://www.w3.org/2000/svg' width='14' height='14' viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='2' stroke-linecap='round' stroke-linejoin='round' style='display:inline;margin-right:4px'><line x1='18' y1='6' x2='6' y2='18'/><line x1='6' y1='6' x2='18' y2='18'/></svg>Recusar</button>
          </div>
        `;
        container.appendChild(item);
      });
    }

    function openDetailModal(requestId) {
      const req = pendingRequests.find(r => r.id === requestId);
      if (!req) return;

      const content = document.getElementById("requestDetailContent");
      content.innerHTML = `
        <div style="background: rgba(255,255,255,0.05); padding: 15px; border-radius: 10px; border: 1px solid rgba(255,255,255,0.1);">
          <p><strong>Motorista:</strong> ${req.worker?.name || 'N/A'}</p>
          <hr style="border: 0; border-top: 1px solid rgba(255,255,255,0.1); margin: 10px 0;">
          <p><strong>Camião:</strong> ${req.truck?.plate} (${req.truck?.model})</p>
          <hr style="border: 0; border-top: 1px solid rgba(255,255,255,0.1); margin: 10px 0;">
          <p><strong>Entrega:</strong></p>
          <ul style="margin: 5px 0; padding-left: 20px; color: var(--text-secondary);">
            <li><strong>Tipo:</strong> ${req.delivery?.tipo}</li>
            <li><strong>Origem:</strong> ${req.delivery?.origem}</li>
            <li><strong>Destino:</strong> ${req.delivery?.destino}</li>
            <li><strong>Data:</strong> ${req.delivery?.data_prevista ? new Date(req.delivery.data_prevista).toLocaleDateString('pt-PT') : 'Não agendada'}</li>
          </ul>
          ${req.delivery?.observacoes ? `<p><strong>Obs:</strong> ${req.delivery.observacoes}</p>` : ''}
        </div>
      `;

      const actions = document.getElementById("detailActions");
      actions.innerHTML = `
        <button class="btn-secondary" onclick="closeDetailModal()">Fechar</button>
        <button class="btn-approve" onclick="respondRequest(${req.id}, true); closeDetailModal();"><svg xmlns='http://www.w3.org/2000/svg' width='14' height='14' viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='2' stroke-linecap='round' stroke-linejoin='round' style='display:inline;margin-right:4px'><polyline points='20 6 9 17 4 12'/></svg>Aprovar</button>
        <button class="btn-reject" onclick="respondRequest(${req.id}, false); closeDetailModal();"><svg xmlns='http://www.w3.org/2000/svg' width='14' height='14' viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='2' stroke-linecap='round' stroke-linejoin='round' style='display:inline;margin-right:4px'><line x1='18' y1='6' x2='6' y2='18'/><line x1='6' y1='6' x2='18' y2='18'/></svg>Recusar</button>
      `;

      document.getElementById("requestDetailModal").style.display = "flex";
      document.getElementById("notificationDropdown").classList.remove("active");
    }

    function closeDetailModal() {
      document.getElementById("requestDetailModal").style.display = "none";
    }

    async function respondRequest(requestId, approved) {
      try {
        const apiUrl = window.location.origin;
        const res = await fetch(`${apiUrl}/respond-request`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ requestId, approved, responderId: user.id })
        });

        const data = await res.json();
        if (res.ok) {
          const message = approved ? "A solicitação foi aprovada com sucesso." : "A solicitação foi recusada com sucesso.";
          showFeedbackModal('Sucesso!', message, true);
          await loadPendingRequests();
          loadDeliveries();
          if (document.getElementById("notificationDropdown").classList.contains("active")) {
            renderRequestsList();
          }
        } else {
          showFeedbackModal('Erro', 'Erro: ' + data.message, false);
        }
      } catch (err) {
        showFeedbackModal('Erro', 'Erro ao responder: ' + err.message, false);
      }
    }

    function openFinishModal(deliveryId, truckId) {
      document.getElementById("finishDeliveryId").value = deliveryId;
      document.getElementById("finishTruckId").value = truckId || "";
      document.getElementById("finishDeliveryModal").style.display = "flex";
    }

    function closeFinishModal() {
      document.getElementById("finishDeliveryModal").style.display = "none";
      document.getElementById("finishDeliveryForm").reset();
    }

    document.getElementById("finishDeliveryForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const deliveryId = document.getElementById("finishDeliveryId").value;
      const truckId = document.getElementById("finishTruckId").value;
      const finalMileage = document.getElementById("finalMileage").value;

      console.log("Finalizando entrega:", { deliveryId, truckId, finalMileage, workerId: user.id });

      try {
        const apiUrl = window.location.origin;
        const res = await fetch(`${apiUrl}/complete-delivery`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            deliveryId: parseInt(deliveryId),
            truckId: truckId ? parseInt(truckId) : null,
            finalMileage: parseInt(finalMileage),
            workerId: user.id
          })
        });

        const data = await res.json();
        console.log("Resposta do servidor:", { status: res.status, data });

        if (res.ok) {
          closeFinishModal();
          loadDeliveries();

          // Verificar se o camião precisa de manutenção após a entrega
          if (data.maintenanceRequired) {
            Swal.fire({
              title: '🔧 Manutenção Necessária!',
              html: '<p>A entrega foi finalizada com sucesso.</p><p style="margin-top:12px; color:#f59e0b;"><strong>O camião atingiu 20.000 km desde a última manutenção e foi bloqueado automaticamente.</strong></p><p style="margin-top:8px; font-size:13px; color:#94a3b8;">Aceda à página de Camiões para realizar a manutenção.</p>',
              icon: 'warning',
              background: '#1e293b',
              color: '#fff',
              confirmButtonColor: '#667eea',
              confirmButtonText: 'Ver Camiões',
              showCancelButton: true,
              cancelButtonText: 'Fechar'
            }).then((result) => {
              if (result.isConfirmed) {
                window.location.href = 'camioes.html';
              }
            });
          } else {
            Swal.fire({
              title: 'Entrega Finalizada!',
              text: 'A entrega foi concluída com sucesso.',
              icon: 'success',
              background: '#1e293b',
              color: '#fff',
              confirmButtonColor: '#667eea',
              timer: 2500,
              timerProgressBar: true
            });
          }
        } else {
          Swal.fire('Erro', data.message || 'Erro ao finalizar entrega', 'error');
        }
      } catch (err) {
        console.error("Erro ao finalizar:", err);
        Swal.fire('Erro', 'Erro ao finalizar entrega: ' + err.message, 'error');
      }
    });

    let feedbackModalTimeout = null;

    function showFeedbackModal(title, message, success) {
      const modalBg = document.getElementById('feedbackModalBg');
      const modalTitle = document.getElementById('feedbackModalTitle');
      const modalMessage = document.getElementById('feedbackModalMessage');
      const modalIcon = document.getElementById('feedbackModalIcon');

      modalTitle.textContent = title;
      modalMessage.textContent = message;
      modalIcon.innerHTML = success
        ? '<i data-lucide="check" style="width:28px;height:28px;"></i>'
        : '<i data-lucide="x" style="width:28px;height:28px;"></i>';
      lucide.createIcons({ nodes: [modalIcon] });
      modalIcon.style.background = success ? 'rgba(34, 197, 94, 0.15)' : 'rgba(239, 68, 68, 0.15)';
      modalIcon.style.color = success ? '#22c55e' : '#f87171';
      modalBg.style.display = 'flex';
      requestAnimationFrame(() => modalBg.classList.add('show'));

      clearTimeout(feedbackModalTimeout);
      if (success) {
        feedbackModalTimeout = setTimeout(closeFeedbackModal, 5000);
      }
    }

    function closeFeedbackModal() {
      const modalBg = document.getElementById('feedbackModalBg');
      modalBg.classList.remove('show');
      modalBg.addEventListener('transitionend', function handler() {
        modalBg.style.display = 'none';
        modalBg.removeEventListener('transitionend', handler);
      });
      clearTimeout(feedbackModalTimeout);
    }

    loadDeliveries();
    lucide.createIcons();
  </script>
</body>

</html>
