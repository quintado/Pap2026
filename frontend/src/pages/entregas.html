<!DOCTYPE html>
<html lang="pt-PT">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CamiGest - Entregas</title>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Outfit:wght@600;700;800&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="css/modern-design.css">
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <style>
    body {
      display: flex;
      min-height: 100vh;
      margin: 0;
      font-family: 'Inter', sans-serif;
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
      position: relative;
      overflow-x: hidden;
    }

    .sidebar {
      width: 260px;
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(20px);
      border-right: 1px solid rgba(255, 255, 255, 0.1);
      display: flex;
      flex-direction: column;
      padding: 24px 16px;
      position: fixed;
      height: 100vh;
      z-index: 100;
    }

    .sidebar-logo {
      text-align: center;
      margin-bottom: 40px;
      padding-bottom: 24px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }

    .sidebar-logo h2 {
      font-family: 'Outfit', sans-serif;
      font-size: 28px;
      font-weight: 800;
      background: linear-gradient(135deg, #667eea, #f093fb);
      -webkit-background-clip: text;
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      margin: 0;
    }

    .sidebar ul {
      list-style: none;
      padding: 0;
      margin: 0;
      flex: 1;
    }

    .sidebar ul li {
      margin-bottom: 8px;
    }

    .sidebar ul li a {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px 16px;
      color: var(--text-secondary);
      text-decoration: none;
      border-radius: 12px;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      font-weight: 500;
      font-size: 15px;
      position: relative;
      overflow: hidden;
    }

    .sidebar ul li a::before {
      content: '';
      position: absolute;
      left: 0;
      top: 0;
      height: 100%;
      width: 3px;
      background: linear-gradient(180deg, #667eea, #764ba2);
      transform: scaleY(0);
      transition: transform 0.3s;
    }

    .sidebar ul li a:hover,
    .sidebar ul li a.active {
      background: rgba(102, 126, 234, 0.15);
      color: var(--text-primary);
      transform: translateX(4px);
    }

    .sidebar ul li a.active::before {
      transform: scaleY(1);
    }

    .sidebar-footer {
      padding-top: 24px;
      border-top: 1px solid rgba(255, 255, 255, 0.1);
    }

    #logout {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, #ef4444, #dc2626);
      border: none;
      border-radius: 12px;
      color: white;
      font-weight: 600;
      font-size: 15px;
      cursor: pointer;
      transition: all 0.3s;
      box-shadow: 0 4px 12px rgba(239, 68, 68, 0.3);
    }

    #logout:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(239, 68, 68, 0.5);
    }

    .main {
      flex: 1;
      margin-left: 260px;
      padding: 32px;
      animation: fadeInUp 0.6s ease-out;
    }

    .header-section {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 32px;
    }

    h1 {
      font-size: 28px;
      font-weight: 700;
      color: var(--text-primary);
      margin: 0;
      font-family: 'Outfit', sans-serif;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .add-btn {
      background: linear-gradient(135deg, #667eea, #764ba2);
      color: white;
      padding: 12px 24px;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      font-weight: 600;
      font-size: 15px;
      transition: all 0.3s;
      box-shadow: 0 4px 12px rgba(102, 126, 234, 0.3);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .add-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(102, 126, 234, 0.5);
    }

    .header-actions {
      display: flex;
      gap: 12px;
      align-items: center;
      position: relative;
    }

    .notification-btn {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: white;
      padding: 12px;
      border-radius: 12px;
      cursor: pointer;
      position: relative;
      transition: all 0.3s;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .notification-btn:hover {
      background: rgba(255, 255, 255, 0.15);
      transform: translateY(-2px);
    }

    .notification-badge {
      position: absolute;
      top: -5px;
      right: -5px;
      background: #ef4444;
      color: white;
      font-size: 10px;
      font-weight: 700;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      display: none;
      align-items: center;
      justify-content: center;
      border: 2px solid #0f172a;
    }

    .notification-badge.active {
      display: flex;
    }

    .request-item {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.05);
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 12px;
    }

    .request-info {
      margin-bottom: 12px;
    }

    .request-info p {
      margin: 4px 0;
      font-size: 14px;
      color: var(--text-secondary);
    }

    .request-info strong {
      color: var(--text-primary);
    }

    .request-actions {
      display: flex;
      gap: 8px;
    }

    .request-actions button {
      flex: 1;
      padding: 8px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s;
    }

    .btn-approve {
      background: rgba(34, 197, 94, 0.2);
      color: #4ade80;
      border: 1px solid rgba(34, 197, 94, 0.4);
    }

    .btn-approve:hover {
      background: rgba(34, 197, 94, 0.3);
    }

    .btn-reject {
      background: rgba(239, 68, 68, 0.2);
      color: #f87171;
      border: 1px solid rgba(239, 68, 68, 0.4);
    }

    .btn-reject:hover {
      background: rgba(239, 68, 68, 0.3);
    }

    .btn-details {
      background: rgba(255, 255, 255, 0.08);
      color: var(--text-primary);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .btn-details:hover {
      background: rgba(255, 255, 255, 0.15);
    }

    .notification-dropdown {
      position: absolute;
      top: 100%;
      right: 0;
      width: 350px;
      background: rgba(30, 41, 59, 0.95);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 16px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
      margin-top: 12px;
      display: none;
      flex-direction: column;
      z-index: 1000;
      overflow: hidden;
      animation: slideIn 0.3s;
    }

    .notification-dropdown.active {
      display: flex;
    }

    .dropdown-header {
      padding: 16px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .dropdown-header h3 {
      margin: 0;
      font-size: 16px;
      font-family: 'Outfit', sans-serif;
    }

    .dropdown-body {
      max-height: 400px;
      overflow-y: auto;
      padding: 12px;
    }

    .dropdown-body::-webkit-scrollbar {
      width: 6px;
    }

    .dropdown-body::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.1);
      border-radius: 3px;
    }

    .filters-section {
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(10px);
      border-radius: 16px;
      padding: 20px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      margin-bottom: 20px;
      display: flex;
      gap: 16px;
      flex-wrap: wrap;
    }

    .filter-group {
      flex: 1;
      min-width: 200px;
    }

    .filter-group label {
      display: block;
      color: var(--text-secondary);
      font-size: 13px;
      font-weight: 500;
      margin-bottom: 6px;
    }

    .filter-group input,
    .filter-group select {
      width: 100%;
      padding: 10px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 10px;
      font-size: 14px;
      color: var(--text-primary);
      transition: all 0.3s;
    }

    .filter-group input:focus,
    .filter-group select:focus {
      outline: none;
      border-color: rgba(102, 126, 234, 0.5);
      background: rgba(255, 255, 255, 0.12);
    }

    .table-container {
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(10px);
      border-radius: 16px;
      padding: 28px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      animation: fadeInUp 0.8s ease-out 0.2s backwards;
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 15px;
    }

    th,
    td {
      text-align: left;
      padding: 14px 12px;
    }

    th {
      background: linear-gradient(135deg, rgba(102, 126, 234, 0.3), rgba(102, 126, 234, 0.2));
      color: var(--text-primary);
      font-weight: 600;
      font-size: 14px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    td {
      color: var(--text-secondary);
      font-size: 15px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
    }

    tr:hover td {
      background-color: rgba(102, 126, 234, 0.1);
      transition: background-color 0.3s;
    }

    .badge {
      padding: 6px 12px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 600;
      display: inline-block;
    }

    .badge.pendente {
      background: rgba(250, 204, 21, 0.2);
      color: #fbbf24;
      border: 1px solid rgba(250, 204, 21, 0.4);
    }

    .badge.em-curso {
      background: rgba(59, 130, 246, 0.2);
      color: #60a5fa;
      border: 1px solid rgba(59, 130, 246, 0.4);
    }

    .badge.concluido {
      background: rgba(34, 197, 94, 0.2);
      color: #4ade80;
      border: 1px solid rgba(34, 197, 94, 0.4);
    }

    .badge.cancelado {
      background: rgba(239, 68, 68, 0.2);
      color: #f87171;
      border: 1px solid rgba(239, 68, 68, 0.4);
    }

    .action-btn {
      background: rgba(102, 126, 234, 0.2);
      border: 1px solid rgba(102, 126, 234, 0.4);
      color: var(--text-primary);
      padding: 6px 12px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 12px;
      font-weight: 600;
      transition: all 0.3s;
      margin-right: 6px;
    }

    .action-btn:hover {
      background: rgba(102, 126, 234, 0.3);
      transform: translateY(-1px);
    }

    .action-btn.delete {
      background: rgba(239, 68, 68, 0.2);
      border: 1px solid rgba(239, 68, 68, 0.4);
    }

    .action-btn.delete:hover {
      background: rgba(239, 68, 68, 0.3);
    }

    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(5px);
      justify-content: center;
      align-items: center;
      z-index: 1000;
      animation: fadeIn 0.3s;
    }

    .modal-content {
      background: linear-gradient(135deg, rgba(30, 41, 59, 0.95), rgba(15, 23, 42, 0.95));
      backdrop-filter: blur(20px);
      padding: 30px;
      border-radius: 16px;
      width: 500px;
      max-width: 90%;
      border: 1px solid rgba(255, 255, 255, 0.1);
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
      animation: slideIn 0.3s;
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
    }

    .modal-header h2 {
      color: var(--text-primary);
      font-family: 'Outfit', sans-serif;
      margin: 0;
      font-size: 22px;
    }

    .close-btn {
      background: none;
      border: none;
      color: var(--text-secondary);
      font-size: 24px;
      cursor: pointer;
      transition: all 0.3s;
    }

    .close-btn:hover {
      color: var(--text-primary);
      transform: rotate(90deg);
    }

    .form-group {
      margin-bottom: 16px;
    }

    .form-group label {
      display: block;
      color: var(--text-secondary);
      font-size: 14px;
      font-weight: 500;
      margin-bottom: 6px;
    }

    .form-group input,
    .form-group select,
    .form-group textarea {
      width: 100%;
      padding: 12px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 10px;
      font-size: 14px;
      color: var(--text-primary);
      transition: all 0.3s;
      font-family: 'Inter', sans-serif;
    }

    .form-group textarea {
      resize: vertical;
      min-height: 80px;
    }

    .form-group input:focus,
    .form-group select:focus,
    .form-group textarea:focus {
      outline: none;
      border-color: rgba(102, 126, 234, 0.5);
      background: rgba(255, 255, 255, 0.12);
    }

    .form-group select option {
      background-color: #1e293b;
      color: white;
    }

    .modal-actions {
      display: flex;
      gap: 12px;
      margin-top: 24px;
    }

    .btn-primary {
      flex: 1;
      background: linear-gradient(135deg, #667eea, #764ba2);
      color: white;
      padding: 12px;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      font-weight: 600;
      transition: all 0.3s;
      box-shadow: 0 4px 12px rgba(102, 126, 234, 0.3);
    }

    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(102, 126, 234, 0.5);
    }

    .btn-secondary {
      flex: 1;
      background: rgba(255, 255, 255, 0.08);
      color: var(--text-primary);
      padding: 12px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 10px;
      cursor: pointer;
      font-weight: 600;
      transition: all 0.3s;
    }

    .btn-secondary:hover {
      background: rgba(255, 255, 255, 0.12);
    }

    .empty-state {
      text-align: center;
      padding: 40px;
      color: var(--text-secondary);
    }

    .empty-state svg {
      width: 80px;
      height: 80px;
      margin-bottom: 16px;
      opacity: 0.5;
    }

    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(30px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
      }

      to {
        opacity: 1;
      }
    }

    @keyframes slideIn {
      from {
        transform: translateY(-20px);
        opacity: 0;
      }

      to {
        transform: translateY(0);
        opacity: 1;
      }
    }

    @media (max-width: 1024px) {
      .sidebar {
        width: 220px;
      }

      .main {
        margin-left: 220px;
      }
    }

    @media (max-width: 768px) {
      .sidebar {
        transform: translateX(-100%);
      }

      .main {
        margin-left: 0;
        padding: 20px;
      }

      .header-section {
        flex-direction: column;
        align-items: flex-start;
        gap: 16px;
      }
    }
  </style>
</head>

<body>

  <nav class="sidebar">
    <div class="sidebar-logo">
      <h2><i data-lucide="truck"
          style="display: inline-block; width: 26px; height: 26px; vertical-align: middle; margin-right: 6px;"></i>CamiGest
      </h2>
    </div>
    <ul>
      <li><a href="dashboard.html"><i data-lucide="layout-dashboard" style="width: 18px; height: 18px;"></i>
          Dashboard</a></li>
      <li><a class="active" href="entregas.html"><i data-lucide="package" style="width: 18px; height: 18px;"></i>
          Entregas</a></li>
      <li><a href="camioes.html"><i data-lucide="truck" style="width: 18px; height: 18px;"></i> Camiões</a></li>
      <li><a href="config.html"><i data-lucide="settings" style="width: 18px; height: 18px;"></i> Configurações</a></li>
    </ul>
    <div class="sidebar-footer">
      <button id="logout"><i data-lucide="log-out" style="width: 18px; height: 18px; margin-right: 8px;"></i>Terminar
        Sessão</button>
    </div>
  </nav>

  <div class="main">
    <div class="header-section">
      <h1><i data-lucide="package" style="width: 28px; height: 28px;"></i> Entregas</h1>
      <div class="header-actions">
        <button class="notification-btn" id="requestNotifyBtn" style="display: none;">
          <i data-lucide="bell" style="width: 20px; height: 20px;"></i>
          <div class="notification-badge" id="notifyBadge">0</div>
        </button>
        <div class="notification-dropdown" id="notificationDropdown">
          <div class="dropdown-header">
            <h3>Solicitações</h3>
            <button class="close-btn" onclick="toggleDropdown()" style="font-size: 18px;">×</button>
          </div>
          <div class="dropdown-body" id="dropdownBody">
          </div>
        </div>

        <button class="add-btn" id="addDeliveryBtn" style="display: none;">
          <i data-lucide="plus" style="width: 18px; height: 18px;"></i> Nova Entrega
        </button>
      </div>
    </div>

    <div class="filters-section">
      <div class="filter-group">
        <label><i data-lucide="search"
            style="width: 14px; height: 14px; vertical-align: middle; margin-right: 4px;"></i> Pesquisar</label>
        <input type="text" id="searchInput" placeholder="Origem ou destino...">
      </div>
      <div class="filter-group">
        <label><i data-lucide="filter"
            style="width: 14px; height: 14px; vertical-align: middle; margin-right: 4px;"></i> Filtrar por
          Estado</label>
        <select id="statusFilter">
          <option value="">Todos</option>
          <option value="pendente">Pendente</option>
          <option value="em-curso">Em Curso</option>
          <option value="concluido">Concluído</option>
          <option value="cancelado">Cancelado</option>
        </select>
      </div>
    </div>

    <div class="table-container">
      <table>
        <thead>
          <tr>
            <th>Tipo</th>
            <th>Origem</th>
            <th>Destino</th>
            <th>Estado</th>
            <th>Data Prevista</th>
            <th id="actionsHeader">Trabalhador</th>
          </tr>
        </thead>
        <tbody id="deliveriesTableBody">
        </tbody>
      </table>
    </div>
  </div>

  <div class="modal" id="deliveryModal">
    <div class="modal-content">
      <div class="modal-header">
        <h2 id="modalTitle">Nova Entrega</h2>
        <button class="close-btn" onclick="closeModal()">×</button>
      </div>

      <form id="deliveryForm">
        <div class="form-group">
          <label>Tipo de Entrega *</label>
          <select id="tipo" required>
            <option value="">Selecione...</option>
            <option value="Paletes">Paletes</option>
            <option value="Documentos">Documentos</option>
            <option value="Refrigerados">Refrigerados</option>
            <option value="Frágeis">Frágeis</option>
            <option value="Outros">Outros</option>
          </select>
        </div>

        <div class="form-group">
          <label>Origem *</label>
          <input type="text" id="origem" required placeholder="Ex: Lisboa">
        </div>

        <div class="form-group">
          <label>Destino *</label>
          <input type="text" id="destino" required placeholder="Ex: Porto">
        </div>

        <div class="form-group">
          <label>Estado *</label>
          <select id="estado" required>
            <option value="pendente">Pendente</option>
            <option value="em-curso">Em Curso</option>
            <option value="concluido">Concluído</option>
            <option value="cancelado">Cancelado</option>
          </select>
        </div>

        <div class="form-group">
          <label>Data Prevista</label>
          <input type="date" id="dataPrevista">
        </div>

        <div class="form-group">
          <label>Observações</label>
          <textarea id="observacoes" placeholder="Informações adicionais..."></textarea>
        </div>

        <div class="modal-actions">
          <button type="button" class="btn-secondary" onclick="closeModal()">Cancelar</button>
          <button type="submit" class="btn-primary">Guardar</button>
        </div>
      </form>
    </div>
  </div>

  <div class="modal" id="requestDeliveryModal">
    <div class="modal-content">
      <div class="modal-header">
        <h2>Pedir Entrega</h2>
        <button class="close-btn" onclick="closeRequestModal()">×</button>
      </div>
      <form id="requestDeliveryForm">
        <input type="hidden" id="requestDeliveryId">
        <div class="form-group">
          <label>Camião Disponível *</label>
          <select id="requestTruckId" required>
            <option value="">A carregar camiões...</option>
          </select>
        </div>
        <div class="modal-actions">
          <button type="button" class="btn-secondary" onclick="closeRequestModal()">Cancelar</button>
          <button type="submit" class="btn-primary">Enviar Pedido</button>
        </div>
      </form>
    </div>
  </div>

  <div class="modal" id="requestDetailModal">
    <div class="modal-content">
      <div class="modal-header">
        <h2>Detalhes da Solicitação</h2>
        <button class="close-btn" onclick="closeDetailModal()">×</button>
      </div>
      <div id="requestDetailContent" class="form-group">
      </div>
      <div class="modal-actions" id="detailActions">
      </div>
    </div>
  </div>

  <div class="modal" id="finishDeliveryModal">
    <div class="modal-content">
      <div class="modal-header">
        <h2>Finalizar Entrega</h2>
        <button class="close-btn" onclick="closeFinishModal()">×</button>
      </div>
      <form id="finishDeliveryForm">
        <input type="hidden" id="finishDeliveryId">
        <input type="hidden" id="finishTruckId">
        <div class="form-group">
          <label>Quilometragem Final *</label>
          <input type="number" id="finalMileage" required placeholder="Ex: 125500">
        </div>
        <div class="modal-actions">
          <button type="button" class="btn-secondary" onclick="closeFinishModal()">Cancelar</button>
          <button type="submit" class="btn-primary">Finalizar Entrega</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    const user = JSON.parse(localStorage.getItem("user"));
    if (!user) window.location.href = "index.html";

    const isManager = user.role?.toLowerCase() === "fundador" || user.role?.toLowerCase() === "supervisor";
    const isWorker = user.role?.toLowerCase() === "trabalhador";
    let editingDeliveryId = null;
    let allDeliveries = [];

    if (isManager) {
      document.getElementById("addDeliveryBtn").style.display = "flex";
      document.getElementById("requestNotifyBtn").style.display = "flex";
      loadPendingRequests();
      setInterval(loadPendingRequests, 30000);
    }

    document.getElementById("actionsHeader").style.display = "table-cell";

    async function loadDeliveries() {
      try {
        const company = (user.company || "").trim();
        const url = `http://localhost:3000/deliveries?company=${encodeURIComponent(company)}`;
        const res = await fetch(url);
        const data = await res.json();

        if (!res.ok) {
          showEmptyState();
          return;
        }

        if (!Array.isArray(data)) {
          showEmptyState();
          return;
        }

        allDeliveries = data;
        renderDeliveries(allDeliveries);
      } catch (err) {
        showEmptyState();
      }
    }

    function renderDeliveries(deliveries) {
      const tbody = document.getElementById("deliveriesTableBody");
      tbody.innerHTML = "";

      const visibleDeliveries = deliveries.filter(delivery => {
        if (delivery.estado === 'concluido' && !isManager) {
          return false;
        }
        return true;
      });

      if (visibleDeliveries.length === 0) {
        showEmptyState();
        return;
      }

      visibleDeliveries.forEach(delivery => {
        const tr = document.createElement("tr");
        const dataPrevista = delivery.data_prevista ? new Date(delivery.data_prevista).toLocaleDateString('pt-PT') : "N/A";

        let workerInfo = "";
        if (delivery.worker) {
          workerInfo = `
            <div style="color: var(--text-primary); font-weight: 600; font-size: 13px;">Trabalhador</div>
            <div style="font-size: 14px; color: #60a5fa;">${delivery.worker.name}</div>
          `;
        } else if (delivery.assigned_to) {
          workerInfo = `
            <div style="color: var(--text-primary); font-weight: 600; font-size: 13px;">Trabalhador (ID: ${delivery.assigned_to})</div>
            <div style="font-size: 14px; color: #f59e0b;">Nome não carregado</div>
          `;
        } else {
          workerInfo = `<div style="color: #f87171; font-size: 13px; font-weight: 500; opacity: 0.8;">⏳ Ainda não foi aceite</div>`;
        }

        const tipo = delivery.tipo || "N/A";
        const origem = delivery.origem || "N/A";
        const destino = delivery.destino || "N/A";
        const estado = delivery.estado || "pendente";

        tr.innerHTML = `
          <td>${tipo}</td>
          <td>${origem}</td>
          <td>${destino}</td>
          <td><span class="badge ${estado}">${formatEstado(estado)}</span></td>
          <td>${dataPrevista}</td>
          <td>
            <div style="margin-bottom: 8px;">${workerInfo}</div>
            <div style="display: flex; gap: 4px; flex-wrap: wrap;">
              ${isManager ? `
                <button class="action-btn" onclick="editDelivery(${delivery.id})" title="Editar">✏️</button>
                <button class="action-btn delete" onclick="deleteDelivery(${delivery.id})" title="Eliminar">🗑️</button>
              ` : ''}
              ${isWorker && delivery.estado === 'pendente' ? `
                <button class="action-btn" onclick="openRequestModal(${delivery.id})">🚚 Pedir Entrega</button>
              ` : ''}
              ${(isManager || (isWorker && delivery.assigned_to === user.id)) && delivery.estado === 'em-curso' ? `
                <button class="action-btn" style="background: rgba(34, 197, 94, 0.2); color: #4ade80; border-color: rgba(34, 197, 94, 0.4);" onclick="openFinishModal(${delivery.id}, ${delivery.truck_id})" title="Finalizar Entrega">🏁 Finalizar</button>
              ` : ''}
            </div>
          </td>
        `;

        tbody.appendChild(tr);
      });
    }

    function formatEstado(estado) {
      const map = {
        'pendente': 'Pendente',
        'em-curso': 'Em Curso',
        'concluido': 'Concluído',
        'cancelado': 'Cancelado'
      };
      return map[estado] || estado;
    }

    function showEmptyState() {
      const tbody = document.getElementById("deliveriesTableBody");
      tbody.innerHTML = `<tr><td colspan="${isManager ? 6 : 5}" class="empty-state"><div>📦</div><p>Nenhuma entrega encontrada</p></td></tr>`;
    }

    document.getElementById("searchInput").addEventListener("input", applyFilters);
    document.getElementById("statusFilter").addEventListener("change", applyFilters);

    function applyFilters() {
      const searchTerm = document.getElementById("searchInput").value.toLowerCase();
      const statusFilter = document.getElementById("statusFilter").value;

      const filtered = allDeliveries.filter(delivery => {
        const origem = (delivery.origem || "").toLowerCase();
        const destino = (delivery.destino || "").toLowerCase();
        const tipo = (delivery.tipo || "").toLowerCase();
        const estado = delivery.estado || "pendente";

        const matchesSearch = origem.includes(searchTerm) || destino.includes(searchTerm) || tipo.includes(searchTerm);
        const matchesStatus = !statusFilter || estado === statusFilter;

        return matchesSearch && matchesStatus;
      });

      renderDeliveries(filtered);
    }

    document.getElementById("addDeliveryBtn").addEventListener("click", () => {
      editingDeliveryId = null;
      document.getElementById("modalTitle").textContent = "Nova Entrega";
      document.getElementById("deliveryForm").reset();
      document.getElementById("deliveryModal").style.display = "flex";
    });

    function closeModal() {
      document.getElementById("deliveryModal").style.display = "none";
      editingDeliveryId = null;
    }

    async function editDelivery(id) {
      const delivery = allDeliveries.find(d => d.id === id);
      if (!delivery) return;

      editingDeliveryId = id;
      document.getElementById("modalTitle").textContent = "Editar Entrega";
      document.getElementById("tipo").value = delivery.tipo;
      document.getElementById("origem").value = delivery.origem;
      document.getElementById("destino").value = delivery.destino;
      document.getElementById("estado").value = delivery.estado;

      if (delivery.data_prevista) {
        document.getElementById("dataPrevista").value = new Date(delivery.data_prevista).toISOString().split('T')[0];
      } else {
        document.getElementById("dataPrevista").value = "";
      }

      document.getElementById("observacoes").value = delivery.observacoes || "";
      document.getElementById("deliveryModal").style.display = "flex";
    }

    document.getElementById("deliveryForm").addEventListener("submit", async (e) => {
      e.preventDefault();

      const data = {
        tipo: document.getElementById("tipo").value,
        origem: document.getElementById("origem").value,
        destino: document.getElementById("destino").value,
        estado: document.getElementById("estado").value,
        dataPrevista: document.getElementById("dataPrevista").value,
        observacoes: document.getElementById("observacoes").value,
        [editingDeliveryId ? 'updatedBy' : 'createdBy']: user.id
      };

      const apiUrl = window.location.origin;
      const url = editingDeliveryId ? `${apiUrl}/update-delivery/${editingDeliveryId}` : `${apiUrl}/create-delivery`;
      const method = editingDeliveryId ? "PUT" : "POST";

      try {
        const res = await fetch(url, {
          method,
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(data)
        });

        const result = await res.json();
        if (!res.ok) {
          alert(result.message);
          return;
        }

        alert(result.message);
        closeModal();
        loadDeliveries();
      } catch (err) {
        alert("Erro ao guardar entrega: " + err.message);
      }
    });

    async function deleteDelivery(id) {
      if (!confirm("Tem certeza que deseja eliminar esta entrega?")) return;

      try {
        const apiUrl = window.location.origin;
        const res = await fetch(`${apiUrl}/delete-delivery/${id}`, {
          method: "DELETE",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ deletedBy: user.id })
        });

        const result = await res.json();
        if (!res.ok) {
          alert(result.message);
          return;
        }

        alert(result.message);
        loadDeliveries();
      } catch (err) {
        alert("Erro ao eliminar entrega: " + err.message);
      }
    }

    document.getElementById("logout").addEventListener("click", () => {
      localStorage.removeItem("user");
      window.location.href = "index.html";
    });

    document.getElementById("deliveryModal").addEventListener("click", (e) => {
      if (e.target.id === "deliveryModal") closeModal();
    });

    async function openRequestModal(deliveryId) {
      document.getElementById("requestDeliveryId").value = deliveryId;
      document.getElementById("requestDeliveryModal").style.display = "flex";

      const select = document.getElementById("requestTruckId");
      select.innerHTML = '<option value="">A carregar camiões...</option>';

      try {
        const apiUrl = window.location.origin;
        const res = await fetch(`${apiUrl}/trucks?status=disponivel&company=${user.company}`);
        const trucks = await res.json();

        // Filtrar camiões em manutenção (mileage_since_maintenance >= 20000)
        const availableTrucks = trucks.filter(truck => {
          const mileageSinceMaintenance = truck.mileage_since_maintenance || 0;
          return mileageSinceMaintenance < 20000;
        });

        if (availableTrucks.length === 0) {
          select.innerHTML = '<option value="">Nenhum camião disponível</option>';
        } else {
          select.innerHTML = '<option value="">Selecione um camião...</option>';
          availableTrucks.forEach(t => {
            const opt = document.createElement("option");
            opt.value = t.id;
            opt.textContent = `${t.plate} (${t.model})`;
            select.appendChild(opt);
          });
        }
      } catch (err) {
        select.innerHTML = '<option value="">Erro ao carregar camiões</option>';
      }
    }

    function closeRequestModal() {
      document.getElementById("requestDeliveryModal").style.display = "none";
      document.getElementById("requestDeliveryForm").reset();
    }

    document.getElementById("requestDeliveryForm").addEventListener("submit", async (e) => {
      e.preventDefault();

      const deliveryId = document.getElementById("requestDeliveryId").value;
      const truckId = document.getElementById("requestTruckId").value;

      if (!truckId) {
        alert("Por favor selecione um camião.");
        return;
      }

      try {
        const apiUrl = window.location.origin;
        const res = await fetch(`${apiUrl}/request-delivery`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            deliveryId: parseInt(deliveryId),
            truckId: parseInt(truckId),
            workerId: user.id
          })
        });

        const data = await res.json();
        if (res.ok) {
          alert("Pedido enviado com sucesso!");
          closeRequestModal();
          loadDeliveries();
        } else {
          alert("Erro: " + data.message);
        }
      } catch (err) {
        alert("Erro ao enviar pedido: " + err.message);
      }
    });

    let pendingRequests = [];

    async function loadPendingRequests() {
      if (!isManager) return;

      try {
        const apiUrl = window.location.origin;
        const res = await fetch(`${apiUrl}/pending-requests?company=${user.company}`);
        pendingRequests = await res.json();
        updateNotificationBadge();
      } catch (err) {
        console.error("Erro ao carregar solicitações:", err);
      }
    }

    function updateNotificationBadge() {
      const badge = document.getElementById("notifyBadge");
      const count = pendingRequests.length;
      badge.textContent = count;

      if (count > 0) {
        badge.classList.add("active");
      } else {
        badge.classList.remove("active");
      }
    }

    document.getElementById("requestNotifyBtn").addEventListener("click", (e) => {
      e.stopPropagation();
      toggleDropdown();
    });

    function toggleDropdown() {
      const dropdown = document.getElementById("notificationDropdown");
      const isActive = dropdown.classList.toggle("active");

      if (isActive) {
        renderRequestsList();
      }
    }

    document.addEventListener("click", (e) => {
      const dropdown = document.getElementById("notificationDropdown");
      const btn = document.getElementById("requestNotifyBtn");

      if (dropdown.classList.contains("active") && !dropdown.contains(e.target) && !btn.contains(e.target)) {
        dropdown.classList.remove("active");
      }
    });

    function renderRequestsList() {
      const container = document.getElementById("dropdownBody");
      container.innerHTML = "";

      if (pendingRequests.length === 0) {
        container.innerHTML = '<p style="text-align: center; color: var(--text-secondary); padding: 20px;">Nenhuma solicitação pendente.</p>';
        return;
      }

      pendingRequests.forEach(req => {
        const item = document.createElement("div");
        item.className = "request-item";

        item.innerHTML = `
          <div class="request-info">
            <p><strong>Motorista:</strong> ${req.worker?.name || 'Desconhecido'}</p>
          </div>
          <div class="request-actions">
            <button class="btn-details" onclick="openDetailModal(${req.id})">🔍 Detalhes</button>
            <button class="btn-approve" onclick="respondRequest(${req.id}, true)">✅ Aceitar</button>
            <button class="btn-reject" onclick="respondRequest(${req.id}, false)">❌ Recusar</button>
          </div>
        `;
        container.appendChild(item);
      });
    }

    function openDetailModal(requestId) {
      const req = pendingRequests.find(r => r.id === requestId);
      if (!req) return;

      const content = document.getElementById("requestDetailContent");
      content.innerHTML = `
        <div style="background: rgba(255,255,255,0.05); padding: 15px; border-radius: 10px; border: 1px solid rgba(255,255,255,0.1);">
          <p><strong>Motorista:</strong> ${req.worker?.name || 'N/A'}</p>
          <hr style="border: 0; border-top: 1px solid rgba(255,255,255,0.1); margin: 10px 0;">
          <p><strong>Camião:</strong> ${req.truck?.plate} (${req.truck?.model})</p>
          <hr style="border: 0; border-top: 1px solid rgba(255,255,255,0.1); margin: 10px 0;">
          <p><strong>Entrega:</strong></p>
          <ul style="margin: 5px 0; padding-left: 20px; color: var(--text-secondary);">
            <li><strong>Tipo:</strong> ${req.delivery?.tipo}</li>
            <li><strong>Origem:</strong> ${req.delivery?.origem}</li>
            <li><strong>Destino:</strong> ${req.delivery?.destino}</li>
            <li><strong>Data:</strong> ${req.delivery?.data_prevista ? new Date(req.delivery.data_prevista).toLocaleDateString('pt-PT') : 'Não agendada'}</li>
          </ul>
          ${req.delivery?.observacoes ? `<p><strong>Obs:</strong> ${req.delivery.observacoes}</p>` : ''}
        </div>
      `;

      const actions = document.getElementById("detailActions");
      actions.innerHTML = `
        <button class="btn-secondary" onclick="closeDetailModal()">Fechar</button>
        <button class="btn-approve" onclick="respondRequest(${req.id}, true); closeDetailModal();">✅ Aprovar</button>
        <button class="btn-reject" onclick="respondRequest(${req.id}, false); closeDetailModal();">❌ Recusar</button>
      `;

      document.getElementById("requestDetailModal").style.display = "flex";
      document.getElementById("notificationDropdown").classList.remove("active");
    }

    function closeDetailModal() {
      document.getElementById("requestDetailModal").style.display = "none";
    }

    async function respondRequest(requestId, approved) {
      try {
        const apiUrl = window.location.origin;
        const res = await fetch(`${apiUrl}/respond-request`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ requestId, approved, responderId: user.id })
        });

        const data = await res.json();
        if (res.ok) {
          alert(approved ? "Solicitação aprovada!" : "Solicitação recusada.");
          await loadPendingRequests();
          loadDeliveries();
          if (document.getElementById("notificationDropdown").classList.contains("active")) {
            renderRequestsList();
          }
        } else {
          alert("Erro: " + data.message);
        }
      } catch (err) {
        alert("Erro ao responder: " + err.message);
      }
    }

    function openFinishModal(deliveryId, truckId) {
      document.getElementById("finishDeliveryId").value = deliveryId;
      document.getElementById("finishTruckId").value = truckId || "";
      document.getElementById("finishDeliveryModal").style.display = "flex";
    }

    function closeFinishModal() {
      document.getElementById("finishDeliveryModal").style.display = "none";
      document.getElementById("finishDeliveryForm").reset();
    }

    document.getElementById("finishDeliveryForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const deliveryId = document.getElementById("finishDeliveryId").value;
      const truckId = document.getElementById("finishTruckId").value;
      const finalMileage = document.getElementById("finalMileage").value;

      console.log("Finalizando entrega:", { deliveryId, truckId, finalMileage, workerId: user.id });

      try {
        const apiUrl = window.location.origin;
        const res = await fetch(`${apiUrl}/complete-delivery`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            deliveryId: parseInt(deliveryId),
            truckId: truckId ? parseInt(truckId) : null,
            finalMileage: parseInt(finalMileage),
            workerId: user.id
          })
        });

        const data = await res.json();
        console.log("Resposta do servidor:", { status: res.status, data });
        
        if (res.ok) {
          closeFinishModal();
          loadDeliveries();

          // Verificar se o camião precisa de manutenção após a entrega
          if (data.maintenanceRequired) {
            Swal.fire({
              title: '🔧 Manutenção Necessária!',
              html: '<p>A entrega foi finalizada com sucesso.</p><p style="margin-top:12px; color:#f59e0b;"><strong>O camião atingiu 20.000 km desde a última manutenção e foi bloqueado automaticamente.</strong></p><p style="margin-top:8px; font-size:13px; color:#94a3b8;">Aceda à página de Camiões para realizar a manutenção.</p>',
              icon: 'warning',
              background: '#1e293b',
              color: '#fff',
              confirmButtonColor: '#667eea',
              confirmButtonText: 'Ver Camiões',
              showCancelButton: true,
              cancelButtonText: 'Fechar'
            }).then((result) => {
              if (result.isConfirmed) {
                window.location.href = 'camioes.html';
              }
            });
          } else {
            Swal.fire({
              title: '✅ Entrega Finalizada!',
              text: 'A entrega foi concluída com sucesso.',
              icon: 'success',
              background: '#1e293b',
              color: '#fff',
              confirmButtonColor: '#667eea',
              timer: 2500,
              timerProgressBar: true
            });
          }
        } else {
          Swal.fire('Erro', data.message || 'Erro ao finalizar entrega', 'error');
        }
      } catch (err) {
        console.error("Erro ao finalizar:", err);
        Swal.fire('Erro', 'Erro ao finalizar entrega: ' + err.message, 'error');
      }
    });

    loadDeliveries();
    lucide.createIcons();
  </script>
</body>

</html>
